<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "No processo penal brasileiro, a doutrina diferencia as causas que impedem o juiz de atuar daquelas que apenas geram suspeição. Qual é a principal distinção teórica entre o impedimento e a suspeição quanto à natureza das causas e à presunção de parcialidade?",
    options: [
      "Ambos os institutos fundamentam-se em causas objetivas, diferenciando-se apenas porque o impedimento gera presunção relativa e a suspeição gera presunção absoluta.",
      "O impedimento decorre de causas objetivas e gera presunção absoluta de parcialidade, enquanto a suspeição deriva de causas subjetivas e gera presunção relativa.",
      "O impedimento aplica-se exclusivamente aos magistrados com presunção relativa, enquanto a suspeição estende-se aos auxiliares da justiça com presunção absoluta.",
      "O impedimento fundamenta-se em elementos subjetivos e gera presunção relativa, enquanto a suspeição envolve razões objetivas e presunção absoluta."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A doutrina diferencia ambos os institutos pela natureza objetiva do impedimento em contraste com a essência subjetiva da suspeição.",
      "Resposta correta. As hipóteses de impedimento vinculam-se a dados objetivos do processo e à vedação absoluta de atuação, ao passo que a suspeição abrange elementos de ordem pessoal e subjetiva cuja parcialidade admite prova em contrário.",
      "A distinção de presunção não se baseia no sujeito, visto que as regras de impedimento e suspeição aplicam-se a todos os sujeitos processuais previstos na norma.",
      "Esse raciocínio inverte a natureza dos vícios, atribuindo características subjetivas ao impedimento e objetivas à suspeição."
    ]
  },
  {
    q: "Um réu preso em um estabelecimento prisional da mesma unidade federativa foi citado exclusivamente por edital após ter sido frustrada a localização por oficial de justiça em sua antiga residência. À luz da jurisprudência sumulada do Supremo Tribunal Federal (Súmula 351), qual é a consequência jurídica dessa citação?",
    options: [
      "O processo é suspenso por prazo indeterminado sem que haja invalidade do ato citatório editalício.",
      "A citação é válida, desde que o diretor do presídio seja notificado no prazo de cinco dias.",
      "A citação por edital é nula, sendo indispensável a citação pessoal do acusado preso.",
      "A citação converte-se automaticamente em citação por hora certa na pessoa do diretor do estabelecimento."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. A inobservância da citação pessoal do réu custodiado gera a nulidade do ato e inviabiliza o prosseguimento regular do processo por meio do edital.",
      "A simples notificação do diretor do estabelecimento prisional supre apenas a requisição para apresentação, permanecendo a obrigatoriedade da citação pessoal do acusado.",
      "Resposta correta. A jurisprudência assentada na Súmula 351 do STF exige a citação pessoal do réu preso na mesma unidade federativa, eivando de nulidade a citação editalícia nesses casos.",
      "O Código de Processo Penal não prevê a conversão automática de citação editalícia em citação por hora certa dirigida ao dirigente do estabelecimento penal."
    ]
  },
  {
    type: "multi",
    q: "No que tange à inatividade processual no processo penal, identifique as afirmativas corretas quanto às diferenças entre a ausência (inatividade real) e o desconhecimento (inatividade ficta).",
    options: [
      "Na ausência, o réu é citado pessoalmente e deixa de oferecer resposta à acusação sem justificativa, prosseguindo o feito com defensor constituído ou dativo sem nova comunicação dos atos posteriores.",
      "De acordo com a Súmula 415 do STJ, o período de suspensão da prescrição no caso do art. 366 do CPP é limitado pelo tempo regulado pela pena máxima cominada ao delito.",
      "A revelia no processo penal opera de forma idêntica ao processo civil, gerando presunção de veracidade dos fatos imputados e dispensa de atuação defensiva.",
      "No desconhecimento, esgotadas as tentativas de citação real, o réu é citado por edital e não comparece, aplicando-se a suspensão do processo e da prescrição nos termos do art. 366 do CPP."
    ],
    correct: [0, 1, 3],
    explanations: [
      "Correta. Na ausência o réu foi citado pessoalmente e opta por não responder; o processo segue com defensor, sem novas intimações ao réu.",
      "Correta. A Súmula 415 do STJ limita o prazo de suspensão da prescrição do art. 366 ao máximo da pena abstratamente cominada.",
      "Incorreta. No processo penal a revelia/ausência não gera presunção de veracidade dos fatos nem dispensa a defesa técnica.",
      "Correta. No desconhecimento (citação por edital sem comparecimento) aplica-se a suspensão do processo e da prescrição (art. 366 do CPP)."
    ]
  },
  {
    q: "Um indivíduo é denunciado pela prática de um crime cuja pena máxima cominada em abstrato é de 3 anos de reclusão. Considerando os critérios estabelecidos no Código de Processo Penal para a definição dos ritos processuais comuns, qual rito deve ser adotado?",
    options: [
      "Rito especial dos funcionários públicos, independentemente da qualidade do agente, em virtude da quantidade de pena.",
      "Rito sumário, pois é destinado aos crimes cuja pena máxima cominada seja inferior a 4 anos e superior a 2 anos.",
      "Rito sumaríssimo, haja vista que a pena máxima de 3 anos se enquadra na competência geral do Juizado Especial Criminal.",
      "Rito ordinário, visto que se aplica a todas as infrações punidas com pena de reclusão superior a 1 ano."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. Os ritos especiais dependem da natureza do crime ou da qualidade do agente, sendo descabida a sua incidência automática apenas pelo quantum de pena de 3 anos.",
      "Resposta correta. O procedimento sumário é aplicável às infrações cuja sanção máxima seja inferior a 4 anos e superior a 2 anos.",
      "O rito sumaríssimo é delimitado pelo teto de pena máxima de até 2 anos, patamar inferior ao delito hipotético de 3 anos.",
      "O procedimento ordinário reserva-se aos crimes cujas penas máximas sejam iguais ou superiores a 4 anos."
    ]
  },
  {
    q: "Quando o juiz rejeita liminarmente a denúncia ou a queixa com base na falta de justa causa ou de pressuposto processual (art. 395 do CPP), qual é o recurso cabível expressamente previsto no Código de Processo Penal?",
    options: [
      "Agravo em execução penal, nos termos do art. 197 da Lei de Execução Penal.",
      "Embargos infringentes, dirigidos ao próprio juízo prolator da decisão de rejeição.",
      "Recurso em Sentido Estrito, fundamentado no art. 581, inciso I, do CPP.",
      "Apelação criminal, fundada no art. 593, inciso I, do CPP."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. O agravo em execução é restrito à fase de execução penal pós-trânsito em julgado, sendo estranho à fase processual do recebimento da acusação.",
      "Os embargos infringentes possuem cabimento exclusivo em sede de recurso contra decisões não unânimes de tribunais, nos termos da legislação processual.",
      "Resposta correta. O artigo 581, inciso I, do CPP estabelece expressamente o Recurso em Sentido Estrito para impugnar a decisão que rejeitar a denúncia ou a queixa.",
      "A apelação é destinada precipuamente ao combate de sentenças definitivas de mérito ou decisões terminativas não enquadradas no rol do recurso em sentido estrito."
    ]
  },
  {
    q: "Após a apresentação da resposta à acusação no rito ordinário, o magistrado reconheceu expressamente a presença de uma causa excludente da ilicitude do fato com base no art. 397, inciso I, do CPP, absolvendo sumariamente o acusado. Contra essa decisão de absolvição sumária, qual é o recurso adequado e onde ele está previsto?",
    options: [
      "Recurso em Sentido Estrito, previsto no art. 581, inciso VIII, do CPP.",
      "Recurso de Apelação, previsto no art. 593, inciso I, do CPP.",
      "Habeas Corpus, haja vista tratar-se de decisão que encerra o processo sem análise do mérito.",
      "Agravo de Instrumento, por analogia ao Código de Processo Civil."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. O Recurso em Sentido Estrito prevê o combate à absolvição sumária apenas quando fundada no inciso IV (extinção da punibilidade), conforme a regra do art. 581, VIII, do CPP.",
      "Resposta correta. Nos termos do art. 593, inciso I, do CPP, a absolvição sumária fundamentada nos incisos I, II e III do art. 397 constitui sentença de mérito impugnável por apelação.",
      "O habeas corpus é uma ação constitucional de impugnação, não possuindo a natureza de recurso ordinário interponível contra sentenças definitivas de absolvição.",
      "O processo penal contempla o sistema recursal próprio, não aplicando o agravo de instrumento do CPC para decisões terminativas de absolvição."
    ]
  },
  {
    type: "multi",
    q: "Quanto às diferenças procedimentais entre o rito comum ordinário e o rito comum sumário previstos no CPP, assinale as características exclusivas ou distintivas do rito sumário.",
    options: [
      "Inexiste a fase de requerimento de diligências prevista no art. 402 do CPP.",
      "O prazo para a realização da audiência de instrução e julgamento é reduzido para 30 dias.",
      "A defesa inicial deve ser apresentada no prazo de 5 dias, diferentemente dos 10 dias previstos no rito ordinário.",
      "O número máximo de testemunhas que cada parte pode arrolar é de até 5 testemunhas por réu/fato."
    ],
    correct: [0, 1, 3],
    explanations: [
      "Correta. No rito sumário não há a fase do art. 402 (requerimento de diligências) existente no ordinário.",
      "Correta. No rito sumário a audiência de instrução e julgamento deve realizar-se no prazo de 30 dias.",
      "Incorreta. A resposta à acusação no rito sumário também é de 10 dias (art. 396 c/c 531 e ss.), e não de 5 dias.",
      "Correta. No rito sumário cada parte pode arrolar até 5 testemunhas (art. 532 do CPP)."
    ]
  },
  {
    q: "Nos crimes contra a honra regidos pelo rito especial previsto nos arts. 519 a 523 do CPP (quando não aplicável a Lei nº 9.099/95), qual ato procedimental específico precede o recebimento da queixa nas ações penais de iniciativa privada?",
    options: [
      "Notificação do Ministério Público para oferecimento obrigatório de transação penal.",
      "Remessa dos autos ao Tribunal de Justiça para julgamento da exceção da verdade antes da instrução.",
      "Realização de uma audiência prévia de conciliação ou reconciliação entre as partes na presença de seus advogados.",
      "Citação pessoal do querelado para prestar depoimento prévio em juízo sob pena de revelia."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. A transação penal é um instituto despenalizador de infrações de menor potencial ofensivo, não se confundindo com o rito especial de reconciliação do art. 520 do CPP.",
      "A exceção da verdade é apresentada no prazo da resposta à acusação após o recebimento da peça inicial, e não antes da instrução ou da audiência de conciliação.",

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
let pendingMulti = null;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================

function isMulti(q) {
  return q.type === "multi" || Array.isArray(q.correct);
}

function normalizeCorrect(q) {
  if (Array.isArray(q.correct)) return q.correct.slice().sort((a,b)=>a-b);
  return [q.correct];
}

function arraysEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  const sa = a.slice().sort((x,y)=>x-y);
  const sb = b.slice().sort((x,y)=>x-y);
  return sa.every((v, i) => v === sb[i]);
}

function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  pendingMulti = null; // seleção temporária em multi
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;
  const multi = isMulti(q);

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;
  if (multi && !alreadyAnswered) {
    html += `<div class="multi-hint">Selecione todas as alternativas corretas e depois confirme.</div>`;
  }

  const userAns = answers[currentIndex];
  const correctSet = normalizeCorrect(q);
  const selectedSet = alreadyAnswered
    ? (Array.isArray(userAns) ? userAns : [userAns])
    : (pendingMulti || []);

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";
    const isSel = selectedSet.includes(i);

    if (alreadyAnswered) {
      cls += " answered";
      const isCorrectOpt = correctSet.includes(i);
      const userPicked = selectedSet.includes(i);
      if (isCorrectOpt) cls += " correct";
      else if (userPicked) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Correta" : (userPicked ? "✗ Incorreta" : "—")}</span>
          ${exp}
        </div>`;
    } else if (multi && isSel) {
      cls += " selected";
    }

    const checkInner = multi
      ? `<span class="check-box">${(alreadyAnswered ? correctSet.includes(i) : isSel) ? "✓" : ""}</span>`
      : `<span class="letter">${letters[i]}</span>`;

    const click = alreadyAnswered
      ? ""
      : (multi ? `onclick="toggleMulti(${i})"` : `onclick="selectOption(${i})"`);

    html += `
      <div class="${cls}" id="opt-${i}" ${click}>
        ${checkInner}
        <div class="option-text">${opt}</div>
        ${fbHtml}
      </div>`;
  });

  if (multi && !alreadyAnswered) {
    html += `<button class="btn btn-primary btn-confirm" id="btnConfirmMulti" onclick="confirmMulti()" disabled>Confirmar resposta</button>`;
  }

  card.innerHTML = html;

  // progress
  const pct = ((currentIndex) / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} de ${questions.length}`;

  // next button state
  const nextBtn = document.getElementById("btnNext");
  if (nextBtn) {
    nextBtn.disabled = !alreadyAnswered;
    nextBtn.textContent = currentIndex === questions.length - 1 ? "Ver resultado" : "Próxima";
  }

  if (multi && !alreadyAnswered) updateConfirmBtn();
}

function toggleMulti(idx) {
  if (answers[currentIndex] !== null) return;
  if (!pendingMulti) pendingMulti = [];
  const pos = pendingMulti.indexOf(idx);
  if (pos >= 0) pendingMulti.splice(pos, 1);
  else pendingMulti.push(idx);

  // update UI
  const q = questions[currentIndex];
  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    if (!el) return;
    const on = pendingMulti.includes(i);
    el.classList.toggle("selected", on);
    const box = el.querySelector(".check-box");
    if (box) box.textContent = on ? "✓" : "";
  });
  updateConfirmBtn();
}

function updateConfirmBtn() {
  const btn = document.getElementById("btnConfirmMulti");
  if (btn) btn.disabled = !pendingMulti || pendingMulti.length === 0;
}

function confirmMulti() {
  if (!pendingMulti || pendingMulti.length === 0) return;
  if (answers[currentIndex] !== null) return;
  answers[currentIndex] = pendingMulti.slice();
  pendingMulti = null;
  answeredCurrent = true;
  renderQuestion();
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return;
  answers[currentIndex] = idx;
  answeredCurrent = true;
  pendingMulti = null;
  renderQuestion();
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    pendingMulti = null;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function isAnswerCorrect(q, userAns) {
  if (userAns === null || userAns === undefined) return false;
  if (isMulti(q)) {
    const correct = normalizeCorrect(q);
    const user = Array.isArray(userAns) ? userAns : [userAns];
    return arraysEqual(correct, user);
  }
  return userAns === q.correct;
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (isAnswerCorrect(questions[i], a)) correct++; });
  const total = questions.length;
  const nota = total > 0 ? (correct / total) * 10 : 0;
  const notaStr = nota.toFixed(1).replace(".", ",");
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = notaStr;
  document.querySelector("#scoreCircle .label").textContent = "de 10,0";

  const circle = document.getElementById("scoreCircle");
  if (nota >= 7.0) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (nota >= 5.0) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${correct} de ${total} acertos (${pct}%) · Nota ${notaStr}`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E", "F"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const ok = isAnswerCorrect(q, userAns);
    const div = document.createElement("div");
    div.className = `result-item ${ok ? "ok" : "err"}`;

    let userText = "—";
    if (userAns !== null && userAns !== undefined) {
      if (Array.isArray(userAns)) {
        userText = userAns.map(j => letters[j] + ") " + q.options[j]).join("<br>");
      } else {
        userText = letters[userAns] + ") " + q.options[userAns];
      }
    }
    const correctSet = normalizeCorrect(q);
    const correctText = correctSet.map(j => letters[j] + ") " + q.options[j]).join("<br>");

    div.innerHTML = `
      <h4>
        <span class="badge ${ok ? "badge-ok" : "badge-err"}">${ok ? "Certa" : "Errada"}</span>
        Questão ${i + 1}
      </h4>
      <p class="rq">${q.q}</p>
      <p><strong>Sua resposta:</strong><br>${userText}</p>
      ${!ok ? `<p><strong>Resposta correta:</strong><br>${correctText}</p>` : ""}
    `;
    review.appendChild(div);
  });
}




function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}
