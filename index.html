<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v=2">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "De acordo com o Código Civil brasileiro (CC/02), a conceituação de posse fundamenta-se precipuamente na Teoria Objetiva de Rudolf von Ihering. Qual é a principal implicação dessa escolha teórica na caracterização do possuidor?",
    options: [
      "Basta a verificação do exercício fático de algum dos poderes inerentes à propriedade, dispensando-se a apuração de uma intenção psicológica complexa de dono.",
      "Exige-se a demonstração simultânea do elemento material (corpus) e da intenção psíquica de ser proprietário (animus domini).",
      "A posse passa a ser considerada um direito real puro, desvinculado de qualquer situação fática ou poder físico sobre o bem.",
      "Impede que o possuidor direto utilize ações possessórias contra o possuidor indireto para defender o bem."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! A teoria objetiva de Ihering define a posse pela exteriorização fática de poderes sobre a coisa, simplificando a caracterização do possuidor sem exigir a prova de intenção de dono.",
      "Essa exigência do elemento psíquico de proprietário (animus domini) pertence à teoria subjetiva de Savigny, não à teoria objetiva.",
      "A posse é qualificada fundamentalmente como uma situação de poder fático sobre o bem, enquanto o rol de direitos reais puros está previsto no art. 1.225.",
      "O art. 1.197 do Código Civil expressamente autoriza que o possuidor direto defenda sua posse inclusive contra o possuidor indireto."
    ]
  },
  {
    q: "Um caseiro reside em um sítio sob as ordens e a subordinação direta do proprietário, zelando pela conservação do imóvel. Segundo o art. 1.198 do Código Civil, qual é a condição jurídica desse caseiro e o que é necessário para alterar essa situação?",
    options: [
      "Trata-se de possuidor de boa-fé com direito de retenção pelas benfeitorias úteis e necessárias realizadas na propriedade.",
      "Trata-se de possuidor direto, podendo converter sua situação em posse ad usucapionem a qualquer momento sem necessidade de alteração fática.",
      "Trata-se de detentor (fâmulo da posse), sendo possível a conversão em posse caso ocorra o rompimento da relação de subordinação e os atos passem a ser exercidos em nome próprio.",
      "Trata-se de detentor perpétuo, cuja condição nunca pode ser alterada por disposição legal e doutrinária."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. O detentor não usufrui dos direitos e efeitos possessórios, como a retenção por benfeitorias, visto que não exerce posse em nome próprio.",
      "O caseiro que atua sob ordens não é possuidor direto, mas sim detentor enquanto perdurar a relação de dependência.",
      "Resposta correta. O fâmulo da posse é mero detentor por estar em relação de subordinação, podendo haver a conversão em posse caso essa subordinação seja rompida e ele passe a agir em nome próprio.",
      "A doutrina e o Enunciado 301 do CJF reconhecem a possibilidade de alteração da detenção para posse mediante a mudança na conduta fática."
    ]
  },
  {
    q: "Sobre a discussão doutrinária a respeito do rol dos direitos reais previsto no art. 1.225 do Código Civil, qual é a distinção fundamental entre a corrente majoritária e a corrente minoritária?",
    options: [
      "A corrente majoritária defende que o rol é exemplificativo (numerus apertus), enquanto a minoritária defende a absoluta ausência de previsão legal para novos institutos.",
      "Ambas as correntes concordam que contratos privados podem criar livremente novos direitos reais sem necessidade de previsão em lei.",
      "A corrente majoritária sustenta que o rol é taxativo (numerus clausus), enquanto a minoritária entende ser exemplificativo, admitindo novos direitos reais em leis extravagantes dada a tipicidade legal.",
      "A corrente minoritária afirma que o art. 1.225 abrange a posse como um dos direitos reais expressos em seus incisos."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. Essa opção inverte os conceitos das correntes, pois a posição majoritária defende a lista fechada (taxativa).",
      "A criação de direitos reais depende sempre de previsão legal (tipicidade), não podendo decorrer exclusivamente da vontade privada contratual.",
      "Resposta correta. A doutrina majoritária considera o rol do art. 1.225 taxativo, ao passo que autores como Tartuce defendem que leis extravagantes podem criar outros direitos reais (como a alienação fiduciária).",
      "A posse não consta nos incisos do art. 1.225; ela integra o Direito das Coisas como situação fática tutelada, não como direito real inscrito no rol."
    ]
  },
  {
    q: "O proprietário de um imóvel decide erguer um muro de grande altura sem qualquer utilidade prática ou estética para sua propriedade, com o objetivo exclusivo de bloquear a entrada de luz e ventilação no imóvel vizinho. Essa conduta caracteriza:",
    options: [
      "Exercício regular e absoluto do jus abutendi (direito de dispor da coisa), tutelado integralmente pelo Código Civil.",
      "Ato emulativo, expressamente vedado pelo § 2º do art. 1.228 do Código Civil por constituir abuso do direito de propriedade sem utilidade e com a intenção de prejudicar outrem.",
      "Exercício legítimo do jus utendi no âmbito dos direitos de vizinhança, prevalecendo sobre os interesses do vizinho.",
      "Hipótese de desapropriação privada judicial, na qual o vizinho afetado passa a ser o proprietário do muro mediante indenização."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. O direito de propriedade não é absoluto e encontra limites expressos na vedação ao abuso de direito e na função social.",
      "Resposta correta. Atos emulativos são aqueles praticados pelo proprietário sem qualquer utilidade própria e movidos pela intenção de causar dano a terceiros.",
      "Praticar atos sem utilidade própria exclusivamente para prejudicar o vizinho excede os limites legítimos do direito de usar.",
      "A desapropriação judicial/posse coletiva (§§ 4º e 5º do art. 1.228) exige extensa área, grupo de pessoas e obras sociais, não se aplicando a conflitos pontuais de utilidade."
    ]
  },
  {
    q: "Um agricultor percebe que seu vizinho alterou o curso de uma cerca, invadindo parcialmente sua fazenda e dificultando o acesso a uma área de cultivo, embora o agricultor continue utilizando o restante do imóvel. Qual é a agressão sofrida e qual ação possessória é a adequada?",
    options: [
      "Sofreu esbulho, devendo ajuizar uma ação de reintegração de posse para afastar a ameaça futura.",
      "Sofreu turbação, pois houve perturbação do exercício da posse sem a perda integral do bem, sendo cabível a ação de manutenção de posse.",
      "Sofreu ameaça, sendo cabível o ajuizamento de ação de imissão na posse.",
      "Sofreu atos emulativos, devendo ingressar com ação reivindicatória de natureza fática."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. O esbulho pressupõe a perda total da posse, e a ação de reintegração visa à recuperação, não apenas ao afastamento de ameaça.",
      "Resposta correta. A turbação ocorre quando o exercício da posse é embaraçado ou dificultado mantendo-se o possuidor na posse de parte ou do todo, remediada pela manutenção de posse.",
      "Já houve perturbação concreta e não mera ameaça; além disso, imissão na posse é ação petitória fundada em título, não ação possessória.",
      "A ação reivindicatória é medida petitória do proprietário não possuidor, inadaptada para tutelar a simples turbação possessória sofrida."
    ]
  },
  {
    q: "O art. 1.210, § 1º, do Código Civil autoriza o instituto do desforço imediato. Quais são os requisitos legais indispensáveis para que o possuidor esbulhado possa utilizar a própria força para recuperar a posse?",
    options: [
      "Reação imediata (praticada logo após a agressão), uso de força proporcional às circunstâncias e finalidade estrita de restabelecer a posse.",
      "Existência de justo título e prova incontestável de propriedade plena (alodial) registrada no Cartório de Imóveis.",
      "Ajuizamento prévio de ação judicial possessória e autorização expressa do juiz para uso de força policial.",
      "Decurso de prazo superior a um ano e um dia (posse velha) sem manifestação de oposição pelo esbulhador."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! A legítima defesa da posse ou desforço imediato exige imediaticidade na reação, limitação do uso da força ao estritamente necessário e foco exclusivo na restituição da posse.",
      "O desforço imediato tutela a situação fática da posse, estando disponível ao possuidor independente de ele ser o proprietário registrado.",
      "O desforço imediato é uma forma de autotutela extrajudicial que dispensa autorização judicial prévia, devendo ser praticado incontinenti.",
      "O prazo de ano e dia diferencia posse nova e posse velha para fins de rito processual, não sendo requisito do desforço imediato."
    ]
  },
  {
    q: "Considere um possuidor de má-fé que realizou benfeitorias em um imóvel antes de ser compelido a restituí-lo ao titular. De acordo com o Código Civil, quais são os direitos desse possuidor quanto ao ressarcimento e à retenção?",
    options: [
      "Pode levantar as benfeitorias úteis e voluptuárias, desde que não cause deterioração ao bem principal.",
      "Perde o direito de indenização por qualquer benfeitoria realizada, devendo ainda pagar perdas e danos pelo valor total do bem.",
      "Tem direito ao ressarcimento apenas das benfeitorias necessárias, mas não lhe assiste o direito de retenção nem o de levantar as benfeitorias voluptuárias.",
      "Tem direito ao ressarcimento de todas as benfeitorias (necessárias, úteis e voluptuárias) e ao direito de retenção até o efetivo pagamento."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. O direito de levantamento de voluptuárias e a indenização por úteis pertencem ao possuidor de boa-fé, sendo vedados ao de má-fé.",
      "As benfeitorias necessárias continuam sendo indenizáveis ao possuidor de má-fé para impedir o enriquecimento ilícito do retomante.",
      "Resposta correta. Ao possuidor de má-fé (art. 1.220 do CC) são ressarcidas somente as benfeitorias necessárias — para evitar o enriquecimento sem causa do proprietário —, sem direito de retenção ou levantamento de voluptuárias.",
      "O direito de retenção e o ressarcimento por benfeitorias úteis são prerrogativas exclusivas do possuidor de boa-fé."
    ]
  },
  {
    q: "Na análise das modalidades de usucapião de bens imóveis, qual é a diferença crucial quanto aos requisitos de título e boa-fé entre a Usucapião Extraordinária (art. 1.238) e a Usucapião Ordinária (art. 1.242)?",
    options: [

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================
function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";

    if (alreadyAnswered) {
      cls += " answered";
      if (i === q.correct) cls += " correct";
      else if (i === answers[currentIndex]) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      const isCorrectOpt = i === q.correct;
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
          ${exp}
        </div>`;
    }

    html += `
      <div class="${cls}" id="opt-${i}" onclick="selectOption(${i})">
        <div class="option-header">
          <div class="option-letter">${letters[i]}</div>
          <div class="option-text">${opt}</div>
        </div>
        ${fbHtml}
      </div>`;
  });

  card.innerHTML = html;

  const pct = (currentIndex / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} / ${questions.length}`;

  const btn = document.getElementById("btnNext");
  btn.disabled = !alreadyAnswered;
  btn.textContent = currentIndex === questions.length - 1 ? "Ver resultado →" : "Próxima →";
  answeredCurrent = alreadyAnswered;
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return; // já respondeu

  answers[currentIndex] = idx;
  answeredCurrent = true;

  const q = questions[currentIndex];
  const letters = ["A", "B", "C", "D", "E", "F"];

  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    el.classList.add("answered");
    el.onclick = null;

    if (i === q.correct) el.classList.add("correct");
    else if (i === idx) el.classList.add("wrong");

    const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
    const isCorrectOpt = i === q.correct;

    const fb = document.createElement("div");
    fb.className = `option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}`;
    fb.innerHTML = `
      <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
      ${exp}`;
    el.appendChild(fb);
  });

  document.getElementById("btnNext").disabled = false;
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (a === questions[i].correct) correct++; });
  const total = questions.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = correct;
  document.querySelector("#scoreCircle .label").textContent = `de ${total}`;

  const circle = document.getElementById("scoreCircle");
  if (pct >= 70) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (pct >= 50) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${pct}% de acertos`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    const div = document.createElement("div");
    div.className = `result-item ${isCorrect ? "ok" : "err"}`;
    div.innerHTML = `
      <h4>
        <span class="badge ${isCorrect ? "badge-ok" : "badge-err"}">${isCorrect ? "✓ Acertou" : "✗ Errou"}</span>
        ${i + 1} / ${total}
      </h4>
      <p style="font-weight:600; margin-bottom:5px;">${q.q}</p>
      <p><b>Sua resposta:</b> ${userAns !== null ? letters[userAns] + ") " + q.options[userAns] : "—"}</p>
      ${!isCorrect ? `<p><b>Correta:</b> ${letters[q.correct]}) ${q.options[q.correct]}</p>` : ""}
      <p style="margin-top:6px;"><b>Explicação:</b> ${(q.explanations && q.explanations[q.correct]) || ""}</p>
    `;
    review.appendChild(div);
  });

  document.getElementById("progressFill").style.width = "100%";
}

function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}

loadQuestions();
