<html lang="pt-BR">
<head>

<meta name="theme-color" content="#1a365d">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "Durante o curso de uma ação penal sob o rito comum ordinário, a defesa impetrou habeas corpus contra a decisão do magistrado de piso que recebeu a denúncia ofertada pelo Ministério Público, alegando ausência de justa causa. Sob o ponto de vista da classificação das decisões judiciais e do sistema recursal no CPP, qual a natureza jurídica desse ato decisório e o motivo do manejo da ação impugnativa?",
    options: [
      "É uma sentença interlocutória mista terminativa, razão pela qual o recurso cabível seria a apelação, sendo o habeas corpus apenas um substitutivo recursal.",
      "Trata-se de decisão interlocutória, a qual gera gravame à parte e não comporta recurso próprio previsto em lei, fundamentando o cabimento da ação impugnativa autônoma.",
      "É uma decisão interlocutória mista não terminativa, sendo atacável originariamente por recurso em sentido estrito (RSE) com base no art. 581 do CPP.",
      "Tratando-se de ato de mero expediente, é irrecorrível de forma absoluta, cabendo o habeas corpus apenas por construção doutrinária sem previsão de gravame."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. O recebimento da denúncia não encerra a fase procedimental ou o processo, não se classificando como sentença mista terminativa nem desafiando apelação.",
      "Resposta correta. As decisões interlocutórias possuem caráter decisório e gravame, mas, por falta de previsão legal de recurso genérico no CPP contra o recebimento da denúncia, admite-se a utilização de ações de impugnação como o habeas corpus.",
      "O artigo 581 do CPP prevê RSE para a rejeição da denúncia ou queixa, mas não estabelece recurso contra a decisão que a recebe.",
      "Despachos de mero expediente não possuem cunho decisório nem geram gravame, enquanto o recebimento da denúncia possui mínimo caráter decisório e causa prejuízo à parte."
    ]
  },
  {
    q: "Em uma sentença penal condenatória, o juiz fundamentou devidamente a autoria e a materialidade delitiva, mas deixou de analisar a tese defensiva de legítima defesa apresentada em sede de alegações finais. Com base na estrutura da sentença penal e nas exigências constitucionais e legais de fundamentação, qual o vício presente no provimento jurisdicional?",
    options: [
      "Nulidade absoluta por violação da motivação, haja vista o dever constitucional de enfrentar a totalidade das teses acusatórias e defensivas.",
      "Mera irregularidade formal no relatório, passível de simples correção de ofício pelo magistrado após o trânsito em julgado.",
      "Anulabilidade relativa, que exige a comprovação de prejuízo pela defesa somente em sede de Revisão Criminal.",
      "Ausência de justa causa no dispositivo da sentença, ensejando a mutatio libelli automática no tribunal de segundo grau."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! A motivação é o ponto nevrálgico da sentença e exige o enfrentamento integral das teses das partes, sob pena de nulidade insanável da decisão nos termos do art. 315, § 2º, e art. 381 do CPP.",
      "O não enfrentamento de tese defensiva afeta a motivação e a validade substancial do provimento, constituindo vício grave de nulidade e não mera falha no relatório.",
      "A ausência de apreciação das teses defensivas vulnera a ampla defesa e a motivação das decisões, acarretando nulidade que pode e deve ser arguida na via recursal ordinária.",
      "A justa causa é condição da ação apreciada no recebimento ou rejeição da inicial, enquanto a falta de análise de tese na motivação invalida a própria sentença por vício de fundamentação."
    ]
  },
  {
    type: "multi",
    q: "Sobre a aplicação da emendatio libelli (art. 383 do CPP) no processo penal brasileiro e suas repercussões doutrinárias e constitucionais, quais das assertivas a seguir refletem adequadamente o instituto?",
    options: [
      "Quando o afastamento de uma elementar por ausência de prova enseja a condenação por crime residual decomponível, não há necessidade de aditamento ou nova instrução.",
      "Exige obrigatoriamente o aditamento da denúncia ou queixa pelo Ministério Público no prazo de 5 dias sempre que acarretar alteração da pena.",
      "A doutrina crítica aponta que a aplicação direta da emendatio libelli na sentença sem consulta prévia às partes pode vulnerar os princípios do contraditório e da ampla defesa.",
      "Permite ao magistrado atribuir definição jurídica diversa dos fatos narrados na acusação no momento da sentença, ainda que isso resulte na aplicação de pena mais grave."
    ],
    correct: [0, 2, 3],
    explanations: [
      "Correta. Na emendatio, os fatos permanecem os mesmos; se a elementar não se prova e resta crime residual, não há mutatio nem aditamento.",
      "Incorreta. O aditamento obrigatório no prazo de 5 dias é da mutatio libelli (art. 384), não da emendatio.",
      "Correta. Parte da doutrina critica a emendatio na sentença sem prévio contraditório, por risco à ampla defesa.",
      "Correta. A emendatio permite nova definição jurídica dos mesmos fatos, inclusive com pena mais grave, sem aditamento."
    ]
  },
  {
    q: "Durante o julgamento de apelação criminal interposta pela defesa, a Turma Julgadora do Tribunal de Justiça constatou a existência de uma circunstância elementar não contida na denúncia, provada ao longo da instrução de primeiro grau. Diante disso, os desembargadores pretendem aplicar o procedimento da mutatio libelli (art. 384 do CPP). À luz da jurisprudência sumulada do Supremo Tribunal Federal, como deve proceder o Tribunal?",
    options: [
      "Pode proceder à mutatio libelli diretamente no acórdão, desde que a nova capitulação reduza a pena final do acusado.",
      "É permitida a mutatio libelli apenas se o Ministério Público de primeiro grau tiver feito o pedido expressamente nas razões de apelação.",
      "Deve converter o julgamento em diligência para que o Procurador de Justiça adite a denúncia no prazo de 5 dias em segundo grau.",
      "É vedada a aplicação da mutatio libelli em segundo grau de jurisdição, sob pena de supressão de instância e violação do contraditório."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. A vedação sumulada impede qualquer alteração decorrente de fato novo em segundo grau, independentemente de beneficiar ou prejudicar o réu.",
      "O obstáculo sumulado reside no impedimento de inovar a imputação fática no tribunal, mesmo que haja provocação acusatória.",
      "A vedação da Súmula 453 do STF impede o próprio aditamento em segundo grau para incluir fato novo não contido na inicial acusatória.",
      "Resposta correta. A Súmula 453 do STF estabelece expressamente que não se aplica a mutatio libelli em segundo grau, preservando o duplo grau e o contraditório."
    ]
  },
  {
    q: "Ao apresentar alegações finais no rito ordinário, o Ministério Público requereu a absolvição do réu por insuficiência de provas. O magistrado, contudo, proferiu sentença condenatória com base no art. 385 do CPP. De acordo com a doutrina processualista moderna fundada no sistema acusatório constitucional, qual a crítica central a essa atuação judicial?",
    options: [
      "A condenação sem pedido do titular da ação penal viola os princípios acusatório, da imparcialidade e da correlação entre acusação e sentença.",
      "O julgamento é válido, pois o princípio do in dubio pro societate obriga o juiz a condenar sempre que o órgão acusador abdicar da pretensão punitiva.",
      "A atuação do magistrado é inatacável, porque a ação penal pública torna-se indisponível e irretratável até o trânsito em julgado.",
      "A sentença é nula apenas se a defesa não tiver tido a oportunidade de apresentar memoriais após a manifestação absolutória do Parquet."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! Quando o titular da ação retira o pedido condenatório, o juiz fica impedido de prover além da pretensão existente, sob pena de atuar como acusador de ofício.",
      "O princípio acusatório exige a separação das funções de acusar e julgar, não havendo dever de condenação pautado em in dubio pro societate.",
      "Embora a ação pública seja indisponível quanto ao seu ajuizamento, a manifestação opinativa do MP no mérito delimita o quadro cognitivo sobre o qual o juiz pode decidir favoravelmente à condenação.",
      "A nulidade decorre do vício constitucional da ausência de pretensão acusatória ativa ao tempo do julgamento, extrapolando o simples contraditório formal."
    ]
  },
  {
    type: "multi",
    q: "No âmbito do direito processual penal, a coisa julgada desempenha papel fundamental na estabilização das relações jurídicas. Considerando as diferenças entre coisa julgada formal e material, selecione as proposições corretas:",
    options: [
      "A coisa julgada material impede a propositura de nova ação penal pelo mesmo fato e projeta seus efeitos para fora do processo.",
      "A sentença penal condenatória faz coisa julgada soberana e plena, não admitindo qualquer desconstituição ou modificação posterior após o trânsito em julgado.",
      "Decisões que encerram o processo sem julgamento do mérito produzem coisa julgada formal, mas não impedem a reapresentação da matéria se sanado o vício e não extinta a punibilidade.",
      "A coisa julgada formal representa a imutabilidade interna da decisão decorrente da preclusão ou irrecorribilidade, constituindo pré-requisito para a formação da coisa julgada material."
    ],
    correct: [0, 2, 3],
    explanations: [
      "Correta. A coisa julgada material tem efeito externo e impede nova ação pelo mesmo fato.",
      "Incorreta. A sentença condenatória admite revisão criminal e outras vias de desconstituição em hipóteses legais.",
      "Correta. Sem mérito julgado há só coisa julgada formal; sanado o vício e ainda punível o fato, pode haver nova ação.",
      "Correta. A coisa julgada formal é a imutabilidade interna e pré-requisito da material."
    ]
  },
  {
    q: "Um réu que se encontrava custodiado preventivamente na mesma unidade federativa onde tramitava a ação penal foi citado por edital após o oficial de justiça não o localizar em seu endereço residencial. Diante dessa situação fática, qual o posicionamento pacificado na Súmula 351 do Supremo Tribunal Federal acerca da validade desse ato citatório?",
    options: [
      "O ato citatório por edital é válido, mas gera a suspensão automática do processo e da prescrição com base no art. 366 do CPP.",
      "É nula a citação por edital de réu preso na mesma unidade federativa em que tramita o processo.",
      "A citação por edital é plenamente válida, tendo em vista que a citação ficta supre a falta de localização do réu no endereço constante dos autos.",
      "Trata-se de hipótese de inatividade processual real que autoriza o prosseguimento do feito sem a nomeação de defensor dativo."
    ],
    correct: 1,
    explanations: [

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
let pendingMulti = null;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================

function isMulti(q) {
  return q.type === "multi" || Array.isArray(q.correct);
}

function normalizeCorrect(q) {
  if (Array.isArray(q.correct)) return q.correct.slice().sort((a,b)=>a-b);
  return [q.correct];
}

function arraysEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  const sa = a.slice().sort((x,y)=>x-y);
  const sb = b.slice().sort((x,y)=>x-y);
  return sa.every((v, i) => v === sb[i]);
}

function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  pendingMulti = null; // seleção temporária em multi
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;
  const multi = isMulti(q);

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;
  if (multi && !alreadyAnswered) {
    html += `<div class="multi-hint">Selecione todas as alternativas corretas e depois confirme.</div>`;
  }

  const userAns = answers[currentIndex];
  const correctSet = normalizeCorrect(q);
  const selectedSet = alreadyAnswered
    ? (Array.isArray(userAns) ? userAns : [userAns])
    : (pendingMulti || []);

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";
    const isSel = selectedSet.includes(i);

    if (alreadyAnswered) {
      cls += " answered";
      const isCorrectOpt = correctSet.includes(i);
      const userPicked = selectedSet.includes(i);
      if (isCorrectOpt) cls += " correct";
      else if (userPicked) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Correta" : (userPicked ? "✗ Incorreta" : "—")}</span>
          ${exp}
        </div>`;
    } else if (multi && isSel) {
      cls += " selected";
    }

    const checkInner = multi
      ? `<span class="check-box">${(alreadyAnswered ? correctSet.includes(i) : isSel) ? "✓" : ""}</span>`
      : `<span class="letter">${letters[i]}</span>`;

    const click = alreadyAnswered
      ? ""
      : (multi ? `onclick="toggleMulti(${i})"` : `onclick="selectOption(${i})"`);

    html += `
      <div class="${cls}" id="opt-${i}" ${click}>
        ${checkInner}
        <div class="option-text">${opt}</div>
        ${fbHtml}
      </div>`;
  });

  if (multi && !alreadyAnswered) {
    html += `<button class="btn btn-primary btn-confirm" id="btnConfirmMulti" onclick="confirmMulti()" disabled>Confirmar resposta</button>`;
  }

  card.innerHTML = html;

  // progress
  const pct = ((currentIndex) / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} de ${questions.length}`;

  // next button state
  const nextBtn = document.getElementById("btnNext");
  if (nextBtn) {
    nextBtn.disabled = !alreadyAnswered;
    nextBtn.textContent = currentIndex === questions.length - 1 ? "Ver resultado" : "Próxima";
  }

  if (multi && !alreadyAnswered) updateConfirmBtn();
}

function toggleMulti(idx) {
  if (answers[currentIndex] !== null) return;
  if (!pendingMulti) pendingMulti = [];
  const pos = pendingMulti.indexOf(idx);
  if (pos >= 0) pendingMulti.splice(pos, 1);
  else pendingMulti.push(idx);

  // update UI
  const q = questions[currentIndex];
  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    if (!el) return;
    const on = pendingMulti.includes(i);
    el.classList.toggle("selected", on);
    const box = el.querySelector(".check-box");
    if (box) box.textContent = on ? "✓" : "";
  });
  updateConfirmBtn();
}

function updateConfirmBtn() {
  const btn = document.getElementById("btnConfirmMulti");
  if (btn) btn.disabled = !pendingMulti || pendingMulti.length === 0;
}

function confirmMulti() {
  if (!pendingMulti || pendingMulti.length === 0) return;
  if (answers[currentIndex] !== null) return;
  answers[currentIndex] = pendingMulti.slice();
  pendingMulti = null;
  answeredCurrent = true;
  renderQuestion();
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return;
  answers[currentIndex] = idx;
  answeredCurrent = true;
  pendingMulti = null;
  renderQuestion();
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    pendingMulti = null;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function isAnswerCorrect(q, userAns) {
  if (userAns === null || userAns === undefined) return false;
  if (isMulti(q)) {
    const correct = normalizeCorrect(q);
    const user = Array.isArray(userAns) ? userAns : [userAns];
    return arraysEqual(correct, user);
  }
  return userAns === q.correct;
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (isAnswerCorrect(questions[i], a)) correct++; });
  const total = questions.length;
  const nota = total > 0 ? (correct / total) * 10 : 0;
  const notaStr = nota.toFixed(1).replace(".", ",");
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = notaStr;
  document.querySelector("#scoreCircle .label").textContent = "de 10,0";

  const circle = document.getElementById("scoreCircle");
  if (nota >= 7.0) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (nota >= 5.0) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${correct} de ${total} acertos (${pct}%) · Nota ${notaStr}`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E", "F"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const ok = isAnswerCorrect(q, userAns);
    const div = document.createElement("div");
    div.className = `result-item ${ok ? "ok" : "err"}`;

    let userText = "—";
    if (userAns !== null && userAns !== undefined) {
      if (Array.isArray(userAns)) {
        userText = userAns.map(j => letters[j] + ") " + q.options[j]).join("<br>");
      } else {
        userText = letters[userAns] + ") " + q.options[userAns];
      }
    }
    const correctSet = normalizeCorrect(q);
    const correctText = correctSet.map(j => letters[j] + ") " + q.options[j]).join("<br>");

    div.innerHTML = `
      <h4>
        <span class="badge ${ok ? "badge-ok" : "badge-err"}">${ok ? "Certa" : "Errada"}</span>
        Questão ${i + 1}
      </h4>
      <p class="rq">${q.q}</p>
      <p><strong>Sua resposta:</strong><br>${userText}</p>
      ${!ok ? `<p><strong>Resposta correta:</strong><br>${correctText}</p>` : ""}
    `;
    review.appendChild(div);
  });
}




function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}
