<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Letícia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v=2">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "No processo penal brasileiro, a distinção entre despachos de mero expediente e decisões interlocutórias reflete a presença ou ausência de cunho decisório e a geração de prejuízo às partes. Qual das alternativas a seguir exemplifica uma decisão de natureza interlocutória?",
    options: [
      "Despacho de 'intime-se' a testemunha para comparecimento à audiência.",
      "Indeferimento do pedido de habilitação como assistente da acusação.",
      "Despacho ordenando 'dê-se vista' ao Ministério Público.",
      "Despacho determinando 'junte-se' aos autos petição apresentada."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A ordenação de intimação serve para a simples marcha processual e não gera gravame às partes envolvidas.",
      "Resposta correta. Decisões interlocutórias possuem um mínimo de caráter decisório e acarretam gravame ou prejuízo para uma das partes no curso do procedimento.",
      "Atos de movimentação procedimental rotineira não resolvem questões pendentes e carecem de cunho decisório.",
      "Trata-se de um ato meramente ordenatório do processo, sem qualquer conteúdo decisório ou prejuízo para as partes."
    ]
  },
  {
    q: "Ao elaborar uma sentença penal, o magistrado deve cumprir o dever constitucional de fundamentação. Em qual das seções constitutivas da sentença o juiz deve obrigatoriamente analisar e enfrentar a totalidade das teses acusatórias e defensivas, sob o aspecto fático e jurídico?",
    options: [
      "Dispositivo",
      "Motivação",
      "Relatório",
      "Ementa"
    ],
    correct: 1,
    explanations: [
      "O dispositivo é a parte final que declara a absolvição ou condenação do réu, realizando a dosimetria sem conter a apreciação fundamentada das teses.",
      "Isso mesmo! A motivação é o ponto nevrálgico da sentença, exigindo a valoração fática da prova e o enfrentamento de todas as teses jurídicas sob pena de nulidade.",
      "O relatório serve apenas para identificar as partes e resumir a morfologia e os acontecimentos objetivos ocorridos ao longo do processo.",
      "A ementa consiste em um resumo sintético da decisão em julgamentos colegiados, não integrando a estrutura tripartite fundamental da sentença em primeiro grau."
    ]
  },
  {
    q: "Quando houver a produção de prova de uma elementar ou circunstância não contida expressamente na peça acusatória, configurando a presença de um fato processual novo, o juiz deve observar o instituto da ________ libelli (art. 384 do CPP), o qual exige o aditamento da denúncia ou queixa. Qual é o termo que completa corretamente a lacuna?",
    options: [
      "emendatio",
      "mutatio",
      "ampliatio",
      "correctio"
    ],
    correct: 1,
    explanations: [
      "A emendatio libelli (art. 383 do CPP) permite ao juiz corrigir a capitulação jurídica sem alterar os fatos narrados, não exigindo aditamento.",
      "Resposta correta. A mutatio libelli ocorre quando surge prova de elemento ou fato novo não descrito na denúncia, exigindo o aditamento ministerial para preservar o contraditório e a correlação.",
      "Não existe o instituto da ampliatio libelli no CPP com esse significado.",
      "Não há instituto processualmente denominado correctio libelli no Código de Processo Penal."
    ]
  },
  {
    q: "Sobre os institutos processuais previstos na Lei nº 9.099/95, assinale a afirmativa INCORRETA:",
    options: [
      "A homologação da composição dos danos civis em ação penal de iniciativa privada acarreta a extinção da punibilidade pela renúncia ao direito de queixa.",
      "A transação penal é cabível para infrações penais com pena máxima não superior a 2 anos, constituindo ato bilateral.",
      "A suspensão condicional do processo pode ser oferecida quando a pena mínima cominada ao crime for igual ou inferior a 1 ano.",
      "O descumprimento do acordo de transação penal gera automaticamente reincidência e maus antecedentes na ficha do autor do fato."
    ],
    correct: 3,
    explanations: [
      "Afirmativa correta. A composição civil homologada em ação privada equivale à renúncia e extingue a punibilidade.",
      "Afirmativa correta. A transação penal aplica-se a infrações de menor potencial ofensivo (pena máxima até 2 anos).",
      "Afirmativa correta. A suspensão condicional do processo (art. 89 da Lei 9.099/95) exige pena mínima igual ou inferior a 1 ano.",
      "Resposta correta (é a INCORRETA). O descumprimento da transação penal não gera automaticamente reincidência nem maus antecedentes; o processo segue seu curso normal."
    ]
  },
  {
    q: "Por que a Súmula 453 do Supremo Tribunal Federal veda a aplicação do instituto da mutatio libelli (art. 384 do CPP) em segundo grau de jurisdição?",
    options: [
      "Porque a mutatio libelli só pode ser aplicada pelo Ministério Público, e não pelo tribunal.",
      "Para evitar a supressão de instância e a violação aos princípios do contraditório e da ampla defesa, já que a inclusão de fato novo exige aditamento e dilação probatória na primeira instância.",
      "Porque o segundo grau só pode aplicar a emendatio libelli, nunca a mutatio.",
      "Porque a Súmula 453 trata apenas de citação por edital e não de mutatio libelli."
    ],
    correct: 1,
    explanations: [
      "A vedação não se funda na legitimidade exclusiva do MP, mas na necessidade de contraditório e instrução em primeiro grau.",
      "Resposta correta. A alteração dos fatos narrados na acusação exige a reabertura do contraditório e da instrução processual, o que não pode ser realizado diretamente em sede recursal sem violar o duplo grau de jurisdição.",
      "Embora a emendatio seja possível em segundo grau em certas hipóteses, a razão da Súmula 453 é a proteção do contraditório e do duplo grau.",
      "A Súmula 453 do STF trata especificamente da mutatio libelli em segundo grau."
    ]
  },
  {
    q: "De acordo com o entendimento sumulado pelo Supremo Tribunal Federal (Súmula 351), qual é a consequência jurídica da citação realizada por edital quando o réu estiver preso na mesma unidade da federação em que tramita o processo?",
    options: [
      "A citação é nula, devendo o acusado ser citado pessoalmente na unidade prisional.",
      "A citação é plenamente válida se esgotadas as tentativas de localização no endereço residencial.",
      "O processo deve ser suspenso sem declaração de nulidade, aplicando-se o art. 366 do CPP.",
      "A citação editalícia é convertida automaticamente em citação por hora certa pela secretaria do juízo."
    ],
    correct: 0,
    explanations: [
      "Resposta correta. Estando o réu sob custódia do Estado na mesma unidade federativa, a citação ficta por edital é inválida pela exigência da citação pessoal.",
      "Não é bem isso. O fato de o réu estar preso sob o controle do próprio Estado invalida a alegação de paradeiro ignorado ou incerto para fins de citação ficta.",
      "A suspensão do art. 366 exige a validade da citação por edital de quem não é encontrado; caso o réu esteja preso na mesma unidade, a citação editalícia é nula.",
      "A citação por hora certa pressupõe ocultação dolosa do réu solto, não se aplicando ao réu preso que deve ser citado pessoalmente."
    ]
  },
  {
    q: "Quando o réu é citado pessoalmente e, de forma injustificada, deixa de apresentar resposta à acusação ou de comparecer aos atos processuais, ocorre a inatividade processual real, gerando a situação de ________, em que o processo prossegue com o defensor sem novas intimações ao réu. Qual termo completa a lacuna?",
    options: [
      "revelia",
      "ausência",
      "contumácia absoluta",
      "deserção"
    ],
    correct: 1,
    explanations: [
      "No processo penal não se aplica a revelia nos mesmos moldes do processo civil; o termo técnico usual é ausência.",
      "Resposta correta. A ausência ocorre quando o réu validamente citado pessoalmente opta por não exercer o direito de presença, prosseguindo o feito com a defesa sem paralisar o processo.",
      "Contumácia é expressão mais comum em outros contextos; o termo consagrado para a situação descrita é ausência.",
      "Deserção refere-se ao abandono de recurso, não à inatividade do réu citado."
    ]
  },
  {
    q: "No procedimento do Tribunal do Júri, a decisão de impronúncia (art. 414 do CPP) ocorre quando o juiz não se convence da materialidade do fato ou da existência de indícios suficientes de autoria. Qual é a natureza dessa decisão e o recurso cabível para sua impugnação?",
    options: [
      "É uma sentença definitiva de mérito que faz coisa julgada material, impugnável por recurso em sentido estrito.",
      "É uma decisão terminativa que encerra o processo sem julgamento de mérito, impugnável por apelação.",
      "É uma decisão interlocutória mista não terminativa, impugnável por recurso em sentido estrito.",
      "É um despacho irrecorrível que determina o arquivamento definitivo da ação penal."
    ],
    correct: 1,
    explanations: [
      "A impronúncia não julga o mérito e não faz coisa julgada material, pois novas provas podem fundamentar nova denúncia enquanto não extinta a punibilidade.",
      "Resposta correta. A impronúncia encerra a fase do juízo de acusação sem formar coisa julgada material, sendo atacável pelo recurso de apelação nos termos do art. 416 do CPP.",
      "Não é bem isso. A decisão interlocutória mista não terminativa corresponde à pronúncia (art. 413), e não à impronúncia que efetivamente encerra o processo.",
      "A impronúncia possui nítido cunho decisório e admite a interposição de recurso de apelação por parte da acusação."
    ]
  },
  {
    q: "Durante os debates orais na sessão de julgamento do Tribunal do Júri, o art. 478 do CPP veda a referência a determinados atos e elementos processuais para evitar a indução indevida dos jurados. Qual das opções abaixo NÃO está entre as proibições do art. 478?",
    options: [
      "Referência ao silêncio do acusado ou à ausência de seu interrogatório por falta de requerimento.",
      "Referência à decisão de pronúncia e às decisões posteriores que a julgaram admissível.",
      "Referência ao uso de algemas pelo acusado durante a sessão de julgamento.",
      "Referência aos depoimentos prestados pelas testemunhas de acusação na primeira fase do procedimento."
    ],
    correct: 3,
    explanations: [
      "Essa referência é vedada pelo art. 478 do CPP.",
      "Essa referência também é vedada pelo art. 478 do CPP.",
      "O uso de algemas e a menção a ele também estão entre as restrições para não induzir os jurados.",
      "Resposta correta (é a que NÃO é proibida). Os depoimentos das testemunhas prestados na primeira fase podem ser referidos nos debates, não estando na lista de vedações do art. 478."
    ]
  },
  {
    q: "Em conformidade com o princípio da correlação (ou congruência) no processo penal, qual é a limitação imposta ao juiz no momento de proferir a sentença penal?",
    options: [
      "O juiz pode condenar por fato diverso desde que a pena seja menor ou igual à do crime imputado.",

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================
function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";

    if (alreadyAnswered) {
      cls += " answered";
      if (i === q.correct) cls += " correct";
      else if (i === answers[currentIndex]) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      const isCorrectOpt = i === q.correct;
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
          ${exp}
        </div>`;
    }

    html += `
      <div class="${cls}" id="opt-${i}" onclick="selectOption(${i})">
        <div class="option-header">
          <div class="option-letter">${letters[i]}</div>
          <div class="option-text">${opt}</div>
        </div>
        ${fbHtml}
      </div>`;
  });

  card.innerHTML = html;

  const pct = (currentIndex / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} / ${questions.length}`;

  const btn = document.getElementById("btnNext");
  btn.disabled = !alreadyAnswered;
  btn.textContent = currentIndex === questions.length - 1 ? "Ver resultado →" : "Próxima →";
  answeredCurrent = alreadyAnswered;
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return; // já respondeu

  answers[currentIndex] = idx;
  answeredCurrent = true;

  const q = questions[currentIndex];
  const letters = ["A", "B", "C", "D", "E", "F"];

  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    el.classList.add("answered");
    el.onclick = null;

    if (i === q.correct) el.classList.add("correct");
    else if (i === idx) el.classList.add("wrong");

    const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
    const isCorrectOpt = i === q.correct;

    const fb = document.createElement("div");
    fb.className = `option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}`;
    fb.innerHTML = `
      <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
      ${exp}`;
    el.appendChild(fb);
  });

  document.getElementById("btnNext").disabled = false;
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (a === questions[i].correct) correct++; });
  const total = questions.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = correct;
  document.querySelector("#scoreCircle .label").textContent = `de ${total}`;

  const circle = document.getElementById("scoreCircle");
  if (pct >= 70) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (pct >= 50) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${pct}% de acertos`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    const div = document.createElement("div");
    div.className = `result-item ${isCorrect ? "ok" : "err"}`;
    div.innerHTML = `
      <h4>
        <span class="badge ${isCorrect ? "badge-ok" : "badge-err"}">${isCorrect ? "✓ Acertou" : "✗ Errou"}</span>
        ${i + 1} / ${total}
      </h4>
      <p style="font-weight:600; margin-bottom:5px;">${q.q}</p>
      <p><b>Sua resposta:</b> ${userAns !== null ? letters[userAns] + ") " + q.options[userAns] : "—"}</p>
      ${!isCorrect ? `<p><b>Correta:</b> ${letters[q.correct]}) ${q.options[q.correct]}</p>` : ""}
      <p style="margin-top:6px;"><b>Explicação:</b> ${(q.explanations && q.explanations[q.correct]) || ""}</p>
    `;
    review.appendChild(div);
  });

  document.getElementById("progressFill").style.width = "100%";
}

function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}
