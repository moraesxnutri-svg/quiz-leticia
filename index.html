<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Letícia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v=2">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "Em uma reunião no âmbito da Administração Pública federal, identificou-se que um determinado processo exige a participação concomitante de três ministérios para solucionar controvérsias e conferir maior celeridade. Contudo, o objeto central do feito é a instauração de procedimento punitivo para apurar infrações e aplicar sanções administrativas a uma concessionária de serviços públicos. Com base na Lei nº 9.784/99, como a Administração deve proceder em relação à adoção do instituto da decisão coordenada?",
    options: [
      "A decisão coordenada pode ser adotada por se tratar de matéria de relevante interesse público com participação de três ministérios.",
      "A decisão coordenada é cabível, desde que haja a renúncia formal da competência originária de cada autoridade envolvida.",
      "O instituto da decisão coordenada é expressamente vedado para processos administrativos relacionados ao poder sancionador.",
      "O instrumento poderá ser utilizado apenas se a concessionária interessada integrar a mesa decisória com direito a voto antecedente à ata."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. A presença de três órgãos e a relevância da matéria não superam as vedações expressas estabelecidas na legislação para a adoção da decisão coordenada.",
      "A decisão coordenada não exclui nem transfere a responsabilidade originária de cada órgão ou autoridade participante.",
      "Resposta correta. O texto legal proíbe formalmente a aplicação da decisão coordenada em processos licitatórios, naqueles sujeitos ao poder sancionador ou que envolvam autoridades de Poderes distintos.",
      "Os interessados participam na condição de ouvintes, podendo obter direito a voz mediante deferimento, mas não integram o polo decisório."
    ]
  },
  {
    q: "Em 2018, um servidor público federal passou a receber, por ato administrativo eivado de vício de legalidade, o pagamento de uma vantagem pecuniária de trato sucessivo (efeitos patrimoniais contínuos). O servidor atuou de boa-fé. A Administração Pública iniciou formalmente a impugnação da validade desse ato em 2024, invocando o poder-dever de autotutela. Considerando as regras de decadência previstas no art. 54 da Lei nº 9.784/99, assinale a afirmativa correta.",
    options: [
      "A má-fé do servidor é presumida pelo simples recebimento de valores indevidos por mais de três anos, afastando a decadência.",
      "O prazo de decadência é de cinco anos e começou a contar da percepção do primeiro pagamento, consumando-se antes da medida de impugnação em 2024.",
      "O prazo decadencial de cinco anos deve ser contado da data em que o ato foi editado, independentemente da data de percepção da primeira parcela.",
      "A Administração tem o dever de anular o ato a qualquer tempo, pois vícios de legalidade em verbas de pessoal não se sujeitam a prazos decadenciais."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A má-fé exige comprovação nos autos e não pode ser presumida para fins de afastamento da decadência administrativa.",
      "Resposta correta. Em pagamentos de efeitos patrimoniais contínuos, o termo inicial do quinquênio decadencial é a percepção do primeiro pagamento, consumando a decadência em 2023 diante da ausência de impugnação anterior.",
      "Para prestações de efeitos patrimoniais contínuos, a legislação estabelece regra específica atribuindo a contagem a partir da percepção do primeiro pagamento.",
      "A autotutela administrativa em atos favoráveis aos destinatários encontra limite temporal na decadência quinquenal, salvo comprovada má-fé ou flagrante inconstitucionalidade."
    ]
  },
  {
    q: "Um servidor público punido em processo disciplinar com suspensão interpõe recurso administrativo à autoridade superior. Esta, ao reanalisar o caso, verifica a possibilidade de aplicar a pena de demissão. Paralelamente, outro servidor punido com demissão requer a revisão de seu processo disciplinar após dois anos, trazendo documentos inéditos que comprovam sua inocência. Sobre a incidência da reformatio in pejus nestes institutos, assinale a opção correta.",
    options: [
      "O recurso administrativo não exige a prévia manifestação do recorrente para o agravamento da pena, diferentemente da revisão.",
      "No recurso administrativo admite-se o agravamento da sanção se o recorrente for cientificado para alegações prévias; na revisão, é vedado o agravamento.",
      "A revisão permite o agravamento da penalidade se surgirem fatos novos que demonstrem maior gravidade do ilícito.",
      "A reformatio in pejus é vedada tanto no recurso administrativo quanto na revisão disciplinar por imperativo da ampla defesa."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. O parágrafo único do art. 64 condiciona expressamente eventual gravame no recurso à prévia cientificação do recorrente para manifestação.",
      "Resposta correta. No recurso administrativo vigora a possibilidade de reformatio in pejus mediante prévia ciência do recorrente, ao passo que o parágrafo único do art. 65 proíbe expressamente o agravamento na revisão.",
      "A revisão visa exclusivamente a sanar inadequações de sanção em favor do punido, sendo vedado qualquer agravamento da sanção original.",
      "Diferentemente da revisão, o recurso administrativo admite o agravamento da situação do recorrente mediante atendimento de pressupostos procedimentais."
    ]
  },
  {
    q: "O titular de um órgão administrativo federal pretende delegar competências ao chefe de uma divisão subordinada. O rol de matérias inclui: I) edição de regimento interno do órgão; II) decisão de recursos administrativos; e III) autorização de concessão de diárias e passagens. À luz do art. 13 da Lei nº 9.784/99, a delegação almejada é:",
    options: [
      "Inviável, porquanto o instituto da delegação só é admitido entre órgãos sem relação de subordinação hierárquica.",
      "Válida apenas quanto à autorização de concessão de diárias e passagens, sendo vedada para edição de atos normativos e decisão de recursos.",
      "Totalmente válida, pois a relação de subordinação hierárquica autoriza a delegação de qualquer matéria administrativa.",
      "Válida quanto à decisão de recursos administrativos e autorização de diárias, mas vedada para atos normativos."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A delegação é plenamente cabível entre órgãos subordinados, além de ser admitida para órgãos não subordinados por razões técnicas ou territoriais.",
      "Resposta correta. O art. 13 proíbe a delegação da edição de atos normativos, da decisão de recursos administrativos e das matérias de competência exclusiva.",
      "A Lei nº 9.784/99 impõe limitações absolutas a determinados objetos de delegação, independentemente da existência de hierarquia.",
      "A decisão de recursos administrativos figura no rol legal explícito das matérias indelegáveis."
    ]
  },
  {
    q: "Uma autoridade federal tomou conhecimento de uma irregularidade praticada por servidor público. A apuração inicial indicou que a infração é punível com a sanção de suspensão por 20 dias, existindo elementos de autoria e materialidade devidamente definidos. Considerando as normas da Lei nº 8.112/90 e os princípios do processo administrativo, qual procedimento deve ser adotado?",
    options: [
      "Instaurar sindicância punitiva ou PAD direto, garantindo contraditório e ampla defesa, já que a sanção de suspensão por 20 dias pode ser aplicada.",
      "Instaurar sindicância sem direito a contraditório, pois a ampla defesa só se aplica em casos de demissão ou cassação de aposentadoria.",
      "Aplicar a penalidade de suspensão de plano, dispensando qualquer procedimento formal por se tratar de punição de baixa gravidade.",
      "Instaurar obrigatoriamente uma sindicância preparatória e inquisitória, pois o PAD não pode ser instaurado de forma direta."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! A sindicância da Lei nº 8.112/90 que comporta aplicação de pena de suspensão de até 30 dias deixa de ser mera apuração inquisitória e exige o contraditório e a ampla defesa.",
      "Sindicâncias que resultem em penalidades de advertência ou suspensão exigem contraditório, conforme o comando constitucional aplicável aos litigantes e acusados.",
      "A aplicação de qualquer sanção disciplinar exige procedimento formal garantidor do devido processo legal e da ampla defesa.",
      "A sindicância é um procedimento dispensável quando a Administração já dispõe de elementos suficientes para a instauração direta do processo principal."
    ]
  },
  {
    q: "Um administrado foi notificado oficialmente da decisão de um processo administrativo federal no dia 15 de maio (quarta-feira). Sabendo que o prazo legal para a interposição de recurso administrativo é de 10 dias e que o prazo conta-se de modo contínuo, não havendo feriados no período, qual será o termo final do prazo recursal, considerando que o décimo dia incidiu em um sábado (dia 25 de maio)?",
    options: [
      "Sábado, dia 25 de maio, exaurindo-se o direito independentemente de haver expediente público.",
      "Terça-feira, dia 28 de maio, pois a contagem inicia-se apenas no primeiro dia útil subsequente à intimação e computa somente dias úteis.",
      "Segunda-feira, dia 27 de maio, em virtude da prorrogação do vencimento que incidiu em dia sem expediente normal.",
      "Sexta-feira, dia 24 de maio, por exclusão do final de semana da contagem."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. Quando o dia do vencimento cai em final de semana ou dia sem expediente, a lei estipula expressamente a prorrogação para o dia útil subsequente.",
      "Salvo disposição legal em contrário, os prazos na Lei nº 9.784/99 são contínuos e não em dias úteis.",
      "Resposta correta. Exclui-se o dia do início e inclui-se o do vencimento; caindo o término em dia sem expediente (sábado), o prazo prorroga-se até o primeiro dia útil seguinte.",
      "Prazos em dias na Lei nº 9.784/99 contam-se de forma contínua, não se excluindo sábados e domingos do meio da contagem."
    ]
  },
  {
    q: "Servidor público federal demitido ao término de Processo Administrativo Disciplinar (PAD) ajuíza ação judicial alegando duas matérias: (1) nulidade absoluta por ter realizado sua defesa pessoalmente, sem advogado constituído; e (2) pedido para que o juiz reaprecie as provas e substitua a sanção por conveniência e oportunidade. À luz da Súmula Vinculante 5 do STF e da Súmula 665 do STJ, como deve proceder o Poder Judiciário?",
    options: [
      "Reconhecer a validade da defesa pessoal do servidor e restringir o controle judicial ao exame da regularidade formal e legalidade do ato.",
      "Substituir a pena de demissão por advertência com base no juízo de conveniência e oportunidade do próprio Judiciário.",
      "Anular o PAD pelo vício formal da falta de advogado e reapreciar livremente o mérito da sanção aplicada.",
      "Declarar a nulidade da pena de demissão por ferir o direito de representação profissional privativa da advocacia."
    ],
    correct: 0,
    explanations: [

    q: "O artigo 63 da Lei nº 9.784/99 estabelece hipóteses em que o recurso administrativo não será conhecido. Escolha as situações que caracterizam o NÃO CONHECIMENTO e os desdobramentos previstos nesse dispositivo:",
    options: [
      "O não conhecimento do recurso não impede a Administração de rever de ofício o ato ilegal, desde que não ocorrida a preclusão administrativa.",
      "Recurso interposto fora do prazo legal (intempestivo).",
      "Recurso interposto perante órgão incompetente.",
      "Na hipótese de interposição perante órgão incompetente, será indicada ao recorrente a autoridade competente, sendo-lhe devolvido o prazo.",
      "O não conhecimento do recurso gera a imediata extinção do processo com julgamento de mérito favorável à Administração."
    ],
    correct: [0, 1, 2, 3],
    explanations: [
      "Correta. O não conhecimento não impede a revisão de ofício do ato ilegal (se ainda possível).",
      "Correta. Recurso intempestivo não é conhecido.",
      "Correta. Recurso perante órgão incompetente não é conhecido.",

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
let pendingMulti = null;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================

function isMulti(q) {
  return q.type === "multi" || Array.isArray(q.correct);
}

function normalizeCorrect(q) {
  if (Array.isArray(q.correct)) return q.correct.slice().sort((a,b)=>a-b);
  return [q.correct];
}

function arraysEqual(a, b) {
  if (!a || !b || a.length !== b.length) return false;
  const sa = a.slice().sort((x,y)=>x-y);
  const sb = b.slice().sort((x,y)=>x-y);
  return sa.every((v, i) => v === sb[i]);
}

function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  pendingMulti = null; // seleção temporária em multi
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;
  const multi = isMulti(q);

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;
  if (multi && !alreadyAnswered) {
    html += `<div class="multi-hint">Selecione todas as alternativas corretas e depois confirme.</div>`;
  }

  const userAns = answers[currentIndex];
  const correctSet = normalizeCorrect(q);
  const selectedSet = alreadyAnswered
    ? (Array.isArray(userAns) ? userAns : [userAns])
    : (pendingMulti || []);

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";
    const isSel = selectedSet.includes(i);

    if (alreadyAnswered) {
      cls += " answered";
      const isCorrectOpt = correctSet.includes(i);
      const userPicked = selectedSet.includes(i);
      if (isCorrectOpt) cls += " correct";
      else if (userPicked) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Correta" : (userPicked ? "✗ Incorreta" : "—")}</span>
          ${exp}
        </div>`;
    } else if (multi && isSel) {
      cls += " selected";
    }

    const checkInner = multi
      ? `<span class="check-box">${(alreadyAnswered ? correctSet.includes(i) : isSel) ? "✓" : ""}</span>`
      : `<span class="letter">${letters[i]}</span>`;

    const click = alreadyAnswered
      ? ""
      : (multi ? `onclick="toggleMulti(${i})"` : `onclick="selectOption(${i})"`);

    html += `
      <div class="${cls}" id="opt-${i}" ${click}>
        ${checkInner}
        <div class="option-text">${opt}</div>
        ${fbHtml}
      </div>`;
  });

  if (multi && !alreadyAnswered) {
    html += `<button class="btn btn-primary btn-confirm" id="btnConfirmMulti" onclick="confirmMulti()" disabled>Confirmar resposta</button>`;
  }

  card.innerHTML = html;

  // progress
  const pct = ((currentIndex) / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} de ${questions.length}`;

  // next button state
  const nextBtn = document.getElementById("btnNext");
  if (nextBtn) {
    nextBtn.disabled = !alreadyAnswered;
    nextBtn.textContent = currentIndex === questions.length - 1 ? "Ver resultado" : "Próxima";
  }

  if (multi && !alreadyAnswered) updateConfirmBtn();
}

function toggleMulti(idx) {
  if (answers[currentIndex] !== null) return;
  if (!pendingMulti) pendingMulti = [];
  const pos = pendingMulti.indexOf(idx);
  if (pos >= 0) pendingMulti.splice(pos, 1);
  else pendingMulti.push(idx);

  // update UI
  const q = questions[currentIndex];
  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    if (!el) return;
    const on = pendingMulti.includes(i);
    el.classList.toggle("selected", on);
    const box = el.querySelector(".check-box");
    if (box) box.textContent = on ? "✓" : "";
  });
  updateConfirmBtn();
}

function updateConfirmBtn() {
  const btn = document.getElementById("btnConfirmMulti");
  if (btn) btn.disabled = !pendingMulti || pendingMulti.length === 0;
}

function confirmMulti() {
  if (!pendingMulti || pendingMulti.length === 0) return;
  if (answers[currentIndex] !== null) return;
  answers[currentIndex] = pendingMulti.slice();
  pendingMulti = null;
  answeredCurrent = true;
  renderQuestion();
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return;
  answers[currentIndex] = idx;
  answeredCurrent = true;
  pendingMulti = null;
  renderQuestion();
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    pendingMulti = null;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function isAnswerCorrect(q, userAns) {
  if (userAns === null || userAns === undefined) return false;
  if (isMulti(q)) {
    const correct = normalizeCorrect(q);
    const user = Array.isArray(userAns) ? userAns : [userAns];
    return arraysEqual(correct, user);
  }
  return userAns === q.correct;
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (isAnswerCorrect(questions[i], a)) correct++; });
  const total = questions.length;
  const nota = total > 0 ? (correct / total) * 10 : 0;
  const notaStr = nota.toFixed(1).replace(".", ",");
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = notaStr;
  document.querySelector("#scoreCircle .label").textContent = "de 10,0";

  const circle = document.getElementById("scoreCircle");
  if (nota >= 7.0) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (nota >= 5.0) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${correct} de ${total} acertos (${pct}%) · Nota ${notaStr}`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E", "F"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const ok = isAnswerCorrect(q, userAns);
    const div = document.createElement("div");
    div.className = `result-item ${ok ? "ok" : "err"}`;

    let userText = "—";
    if (userAns !== null && userAns !== undefined) {
      if (Array.isArray(userAns)) {
        userText = userAns.map(j => letters[j] + ") " + q.options[j]).join("<br>");
      } else {
        userText = letters[userAns] + ") " + q.options[userAns];
      }
    }
    const correctSet = normalizeCorrect(q);
    const correctText = correctSet.map(j => letters[j] + ") " + q.options[j]).join("<br>");

    div.innerHTML = `
      <h4>
        <span class="badge ${ok ? "badge-ok" : "badge-err"}">${ok ? "Certa" : "Errada"}</span>
        Questão ${i + 1}
      </h4>
      <p class="rq">${q.q}</p>
      <p><strong>Sua resposta:</strong><br>${userText}</p>
      ${!ok ? `<p><strong>Resposta correta:</strong><br>${correctText}</p>` : ""}
    `;
    review.appendChild(div);
  });
}




function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}
