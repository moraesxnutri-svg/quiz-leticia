<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Letícia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v=2">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "Sobre a diferença entre Direito Real e Direito das Coisas e a teoria adotada pelo Código Civil brasileiro, qual afirmação reflete com precisão o arcabouço normativo e doutrinário?",
    options: [
      "O Direito Civil brasileiro adotou a Teoria Pessoal, que define o direito real como uma relação jurídica obrigacional entre pessoas com intermediação indispensável.",
      "A eficácia erga omnes significa que os efeitos do direito real atingem estritamente as partes contratantes envolvidas no negócio jurídico.",
      "A Teoria Realista estabelece que o direito real é um poder imediato da pessoa sobre a coisa, dotado de eficácia erga omnes.",
      "O Direito das Coisas possui um alcance mais restrito do que os Direitos Reais, limitando-se apenas aos direitos de oponibilidade absoluta."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. A doutrina majoritária e o Código Civil adotam a Teoria Realista, caracterizada pela relação direta entre a pessoa e a coisa, dispensando a intermediação de outrem.",
      "Eficácia erga omnes refere-se à oponibilidade contra todos os membros da coletividade, e não apenas inter partes.",
      "Resposta correta. Esta concepção define adequadamente a Teoria Realista de Orlando Gomes e Tartuce, na qual o titular exerce poder direto sobre o bem com oponibilidade perante todos.",
      "O Direito das Coisas é o gênero mais amplo que disciplina a relação entre pessoas e coisas, abrangendo institutos como a posse, que nem sempre configuram direitos reais."
    ]
  },
  {
    q: "Em relação ao rol do art. 1.225 do Código Civil e à discussão sobre a sua tipicidade, assinale a opção que expressa corretamente a controvérsia doutrinária:",
    options: [
      "De acordo com a corrente majoritária, novas figuras de direitos reais só podem surgir mediante alteração direta do texto do art. 1.225 do Código Civil.",
      "A corrente majoritária entende que o rol é exemplificativo (numerus apertus), autorizando a criação contratual de novos direitos reais pelas partes.",
      "A jurisprudência e a doutrina consideram o rol do art. 1.225 como estritamente ilimitado e sem qualquer parâmetro de tipicidade legal.",
      "A corrente minoritária defende que a existência de leis extravagantes que criam direitos reais, como a alienação fiduciária, fundamenta a tese do rol exemplificativo."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. A taxatividade defendida pela maioria refere-se à necessidade de previsão legal (tipicidade), mas não impede a criação de direitos reais por outras leis ordinárias.",
      "A corrente majoritária entende que o rol é taxativo (numerus clausus), impedindo que a autonomia privada crie direitos reais não previstos em lei.",
      "Existe divergência doutrinária consolidada entre a regra geral do rol taxativo e a possibilidade de ampliação mediante previsão legislativa específica.",
      "Resposta correta. Tartuce e a corrente minoritária sustentam que o rol é exemplificativo justamente porque a legislação extravagante pode instituir novos direitos reais além dos previstos no Código Civil."
    ]
  },
  {
    q: "Um proprietário decide erguer um muro elevado em seu terreno sem qualquer utilidade prática ou comodidade, movido exclusivamente pela intenção de prejudicar a iluminação natural do vizinho. Essa conduta caracteriza:",
    options: [
      "Ato emulativo, qualificado pela ausência de utilidade e pela finalidade de causar dano a outrem.",
      "Acessão física de boa-fé amparada pelo princípio da elasticidade do direito real.",
      "Desapropriação privada judicial respaldada pelo poder de disposição (jus abutendi).",
      "Exercício regular do direito de propriedade decorrente do atributo da exclusividade alodial."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! O § 2º do art. 1.228 proíbe os atos emulativos, que são aqueles praticados sem comodidade ou utilidade para o proprietário e com o fim deliberado de prejudicar terceiros.",
      "A intenção de causar prejuízo afasta a boa-fé e viola os deveres de convivência e função social da propriedade.",
      "A desapropriação privada refere-se à posse coletiva com relevância social mediante justa indenização, o que não se confunde com atos lesivos individuais.",
      "O direito de propriedade sofre limitações e não autoriza atitudes praticadas unicamente para lesar terceiros sem utilidade própria."
    ]
  },
  {
    q: "Quanto à distinção entre posse e detenção no Código Civil e às teorias que as fundamentam, assinale a afirmativa correta:",
    options: [
      "O caseiro que conserva a coisa em virtude de uma relação de subordinação em relação ao proprietário é considerado possuidor direto do imóvel.",
      "O Código Civil adotou integralmente a teoria subjetiva de Savigny, exigindo a demonstração do animus domini para a caracterização da posse em geral.",
      "A conversão da detenção em posse é juridicamente inviável devido ao princípio da perpetuidade das relações materiais.",
      "A detenção ocorre quando alguém conserva a posse em nome de outrem, cumprindo ordens e instruções do possuidor originário."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. O caseiro subordinado é qualificado como detentor (fâmulo da posse), pois cumpre ordens e instruções do verdadeiro possuidor.",
      "O Código Civil adotou a teoria objetiva de Ihering (art. 1.196), dispensando a investigação do animus domini como elemento geral da posse.",
      "É possível a conversão da detenção em posse quando ocorre o rompimento da subordinação e o bem passa a ser exercido em nome próprio (Enunciado 301 CJF/STJ).",
      "Resposta correta. A definição do art. 1.198 estabelece o detentor ou fâmulo da posse como aquele que mantém o bem sob relação de dependência e subordinação jurídica."
    ]
  },
  {
    q: "A respeito das classificações da posse quanto aos seus vícios e à presença de boa-fé, assinale a opção correta:",
    options: [
      "A existência de justo título cria uma presunção absoluta de boa-fé, insuscetível de prova em contrário.",
      "A posse injusta é purgada e torna-se justa pelo simples decurso de prazo superior a um ano e um dia.",
      "A posse precária é classificada como posse justa por decorrer de uma concessão contratual ou anuência prévia.",
      "O possuidor de boa-fé é aquele que ignora o vício ou obstáculo que impede a aquisição da coisa, sendo presumida a boa-fé no caso de justo título."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. A presunção de boa-fé conferida pelo justo título é relativa (iuris tantum), podendo ser afastada se demonstrado o conhecimento do vício.",
      "A passagem do tempo (posse velha) altera o rito processual possessório, mas não transforma automaticamente a posse injusta em justa no plano material.",
      "A precariedade constitui vício da posse (posse injusta) quando a pessoa se recusa a restituir a coisa após o término da autorização.",
      "Resposta correta. O art. 1.201 conceitua a posse de boa-fé pelo desconhecimento do vício e estabelece presunção legal em favor de quem possui justo título."
    ]
  },
  {
    q: "Caso um possuidor seja vítima de esbulho e privado totalmente do contato material com a sua propriedade, qual é a ação possessória adequada e a medida de autotutela aplicável?",
    options: [
      "Ação reivindicatória e retenção por benfeitorias realizada no prazo máximo de 1 ano e 1 dia.",
      "Ação de reintegração de posse e desforço imediato proporcional executado logo após a privação.",
      "Interdito proibitório e desforço imediato proporcional a ser praticado em qualquer momento após o esbulho.",
      "Ação de manutenção de posse e exercício da legítima defesa da posse sem limitações temporais."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A ação reivindicatória tem natureza petitória (fundada na propriedade) e não possessória, além de não se confundir com o desforço imediato.",
      "Resposta correta. O esbulho enseja a reintegração de posse (art. 1.210); a autotutela via desforço imediato exige reação contínua e imediata com moderação das forças.",
      "O interdito proibitório aplica-se à mera ameaça de agressão possessória, e a reação direta não pode ser postergada indefinidamente.",
      "A manutenção de posse destina-se aos casos de turbação (perturbação parcial), e a defesa direta exige reação imediata."
    ]
  },
  {
    q: "Um possuidor de boa-fé realizou benfeitorias necessárias e úteis no bem e foi posteriormente acionado pelo proprietário para desocupá-lo. De acordo com o regramento dos efeitos da posse, assinale a opção correta quanto aos direitos desse possuidor:",
    options: [
      "Pode reter o imóvel em razão de benfeitorias voluptuárias realizadas no local até o integral reembolso.",
      "Perde o direito ao ressarcimento das benfeitorias úteis, recebendo compensação financeira unicamente pelas voluptuárias.",
      "Tem direito à indenização e ao direito de retenção pelas benfeitorias necessárias e úteis, podendo levantar as voluptuárias se não houver deterioração do bem principal.",
      "Possui direito à indenização por todas as benfeitorias, mas não pode exercer o direito de retenção sob nenhuma hipótese."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. As benfeitorias voluptuárias não conferem direito de retenção ao possuidor, limitando-se ao direito de levantamento se não causar prejuízo à coisa.",
      "As benfeitorias úteis são indenizáveis e geram direito de retenção ao possuidor de boa-fé; as voluptuárias não geram retenção, apenas levantamento.",
      "Resposta correta. O art. 1.219 concede ao possuidor de boa-fé a retenção/ressarcimento pelas benfeitorias necessárias e úteis e o direito de levantamento das voluptuárias sem dano ao bem.",
      "O possuidor de boa-fé tem expressamente assegurado o direito de retenção do bem até que seja indenizado pelas benfeitorias necessárias e úteis."
    ]
  },
  {
    q: "Ao comparar os requisitos exigidos para a usucapião extraordinária (art. 1.238) e para a usucapião ordinária (art. 1.242) de bens imóveis, constata-se que:",
    options: [
      "A usucapião extraordinária exige justo título e boa-fé apenas quando o prazo é reduzido para 10 anos em razão do estabelecimento de moradia.",
      "A usucapião extraordinária dispensa justo título e boa-fé, enquanto a usucapião ordinária exige cumulativamente ambos os requisitos.",
      "Ambas as modalidades exigem obrigatoriamente a apresentação de instrumento particular com presunção absoluta de boa-fé.",
      "A usucapião ordinária prescinde de justo título, mas torna indispensável a comprovação de boa-fé e de utilização para moradia."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A redução do prazo da usucapião extraordinária para 10 anos decorre da função social (moradia/obras), mantendo-se a dispensa de justo título e boa-fé.",

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================
function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";

    if (alreadyAnswered) {
      cls += " answered";
      if (i === q.correct) cls += " correct";
      else if (i === answers[currentIndex]) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      const isCorrectOpt = i === q.correct;
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
          ${exp}
        </div>`;
    }

    html += `
      <div class="${cls}" id="opt-${i}" onclick="selectOption(${i})">
        <div class="option-header">
          <div class="option-letter">${letters[i]}</div>
          <div class="option-text">${opt}</div>
        </div>
        ${fbHtml}
      </div>`;
  });

  card.innerHTML = html;

  const pct = (currentIndex / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} / ${questions.length}`;

  const btn = document.getElementById("btnNext");
  btn.disabled = !alreadyAnswered;
  btn.textContent = currentIndex === questions.length - 1 ? "Ver resultado →" : "Próxima →";
  answeredCurrent = alreadyAnswered;
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return; // já respondeu

  answers[currentIndex] = idx;
  answeredCurrent = true;

  const q = questions[currentIndex];
  const letters = ["A", "B", "C", "D", "E", "F"];

  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    el.classList.add("answered");
    el.onclick = null;

    if (i === q.correct) el.classList.add("correct");
    else if (i === idx) el.classList.add("wrong");

    const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
    const isCorrectOpt = i === q.correct;

    const fb = document.createElement("div");
    fb.className = `option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}`;
    fb.innerHTML = `
      <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
      ${exp}`;
    el.appendChild(fb);
  });

  document.getElementById("btnNext").disabled = false;
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (a === questions[i].correct) correct++; });
  const total = questions.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = correct;
  document.querySelector("#scoreCircle .label").textContent = `de ${total}`;

  const circle = document.getElementById("scoreCircle");
  if (pct >= 70) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (pct >= 50) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${pct}% de acertos`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    const div = document.createElement("div");
    div.className = `result-item ${isCorrect ? "ok" : "err"}`;
    div.innerHTML = `
      <h4>
        <span class="badge ${isCorrect ? "badge-ok" : "badge-err"}">${isCorrect ? "✓ Acertou" : "✗ Errou"}</span>
        ${i + 1} / ${total}
      </h4>
      <p style="font-weight:600; margin-bottom:5px;">${q.q}</p>
      <p><b>Sua resposta:</b> ${userAns !== null ? letters[userAns] + ") " + q.options[userAns] : "—"}</p>
      ${!isCorrect ? `<p><b>Correta:</b> ${letters[q.correct]}) ${q.options[q.correct]}</p>` : ""}
      <p style="margin-top:6px;"><b>Explicação:</b> ${(q.explanations && q.explanations[q.correct]) || ""}</p>
    `;
    review.appendChild(div);
  });

  document.getElementById("progressFill").style.width = "100%";
}

function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}

loadQuestions();
