<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Letícia">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Quiz Letícia">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v=2">
<link rel="manifest" href="manifest.json?v=2">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "De acordo com o Código Civil brasileiro e a teoria objetiva de Rudolf von Ihering, como se conceitua a figura do possuidor?",
    options: [
      "Apenas a pessoa que detém o título formal registrado no Cartório de Registro de Imóveis.",
      "Todo aquele que tem de fato o exercício, pleno ou não, de algum dos poderes inerentes à propriedade.",
      "O indivíduo que conserva a coisa em virtude de uma relação de dependência econômica ou subordinação funcional.",
      "Aquele que possui a coisa materialmente com a intenção explícita de se tornar seu proprietário definitivo (animus domini)."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A titularidade formal registrada no cartório imobiliário define a propriedade jurídica, que difere da situação fática da posse.",
      "Resposta correta. O artigo 1.196 do Código Civil consagra a Teoria Objetiva de Ihering, definindo a posse como a visibilidade do domínio pelo exercício fático dos poderes proprietários.",
      "A conservação da coisa mediante ordens e dependência caracteriza a detenção (fâmulo da posse), hipótese expressamente distinguida da posse pelo art. 1.198.",
      "A exigência do animus domini conjuntamente com a retenção física pertence à teoria subjetiva de Savigny, e não à teoria objetiva adotada pelo Código Civil."
    ]
  },
  {
    q: "O proprietário de um bem possui quatro atributos tradicionais inerentes ao domínio (Art. 1.228 do CC). Qual faculdade permite extrair os frutos e rendimentos produzidos por esse bem?",
    options: [
      "Reivindicar (rei vindicatio).",
      "Dispor (jus abutendi).",
      "Usar (jus utendi).",
      "Fruir ou gozar (jus fruendi)."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. O direito de reaver representa a pretensão do proprietário de reaver a coisa de quem injustamente a possua ou detenha.",
      "O direito de dispor diz respeito ao poder de alterar a situação jurídica ou material do bem, como vender, doar ou consumir.",
      "O direito de usar refere-se ao emprego do bem para sua finalidade própria sem alterar sua substância ou colher seus rendimentos.",
      "Resposta correta. O jus fruendi consiste no poder de explorar economicamente a coisa e auferir os frutos e rendimentos por ela gerados."
    ]
  },
  {
    q: "O artigo 1.228, § 2º, do Código Civil proíbe os chamados 'atos emulativos'. O que caracteriza essencialmente a prática de um ato emulativo pelo proprietário?",
    options: [
      "O uso do imóvel em desacordo com as diretrizes ambientais, gerando poluição culposa.",
      "A alienação do imóvel a terceiros sem o devido registro no Cartório de Registro de Imóveis.",
      "O exercício do direito de propriedade com a intenção exclusiva de prejudicar outrem, sem qualquer utilidade ou comodidade própria.",
      "A cessão do uso do imóvel a um locatário sem a cobrança de aluguel por prazo determinado."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. A violação de normas ambientais descumpre a função social da propriedade, mas o ato emulativo exige a intenção específica de prejudicar outra pessoa.",
      "A falta de registro afeta a transferência formal da propriedade imobiliária, não se confundindo com ato abusivo praticado contra vizinhos.",
      "Resposta correta. O ato emulativo é um abuso de direito caracterizado pela ausência de benefício legítimo ao proprietário associada ao intuito de causar dano a terceiros.",
      "A cessão gratuita do bem configura negócio jurídico legítimo (comodato) e não um ato abusivo destinado a causar prejuízos."
    ]
  },
  {
    q: "Em relação às classificações da posse, assinale a opção que descreve corretamente a relação entre posse direta e posse indireta em um contrato de locação de imóvel:",
    options: [
      "O locatário detém a posse direta, de caráter temporário, coexistindo com a posse indireta do locador, que lhe cedeu o uso do bem.",
      "O locador detém a posse direta por ter o contato físico com a coisa, enquanto o locatário detém a posse indireta.",
      "O contrato de locação anula a posse do proprietário, transferindo tanto a posse quanto a propriedade ao locatário durante sua vigência.",
      "A posse direta impede que o locatário utilize ações possessórias contra terceiros ou contra o próprio locador."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! Na locação ocorre o desmembramento possessório: o locatário exerce a posse direta (imediata) e o locador conserva a posse indireta (mediata).",
      "A qualificação da relação está invertida, pois o contato material temporário pertence ao locatário e não ao locador.",
      "O contrato de locação apenas desmembra a posse, mantendo a propriedade e a posse indireta sob a titularidade do locador.",
      "O art. 1.197 do Código Civil assegura expressamente ao possuidor direto a defesa de sua posse, inclusive perante o possuidor indireto."
    ]
  },
  {
    q: "Qual é a principal diferença entre a figura do possuidor e a do detentor (fâmulo da posse), conforme o disposto no art. 1.198 do Código Civil?",
    options: [
      "O detentor conserva a coisa em nome alheio, cumprindo ordens ou instruções em uma relação de dependência.",
      "Apenas o detentor dispõe de legitimidade ativa para ajuizar ações possessórias contra invasores.",
      "A detenção jamais pode se converter em posse, mesmo que a relação de subordinação seja totalmente rompida.",
      "O detentor exerce poderes de fato sobre a coisa em nome próprio, enquanto o possuidor atua sob subordinação."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! Nos termos do art. 1.198, o detentor é aquele que atua em razão de dependência funcional ou econômica, conservando o bem em nome do possuidor.",
      "O detentor não possui legitimidade para interpor ações possessórias em nome próprio por não exercer posse plena ou autônoma.",
      "O Enunciado 301 do CJF admite a conversão da detenção em posse caso sejam rompidos os laços de subordinação e iniciados atos em nome próprio.",
      "A definição do comportamento é inversa: o possuidor atua em nome próprio e o detentor exerce os atos em nome de outrem."
    ]
  },
  {
    q: "Em caso de violação da posse por terceiros, a escolha da ação possessória adequada depende da gravidade da agressão. Qual é a medida judicial correta para combater o esbulho possessório?",
    options: [
      "Ação de reintegração de posse.",
      "Interdito proibitório.",
      "Ação reivindicatória.",
      "Ação de manutenção de posse."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! O esbulho caracteriza-se pela privação total da posse, sendo a ação de reintegração de posse o mecanismo específico para recuperá-la.",
      "O interdito proibitório destina-se a prevenir o atentado possessório nos casos de mera ameaça.",
      "A ação reivindicatória é medida petitória fundada no direito de propriedade exercida pelo proprietário não possuidor, não sendo ação possessória pura.",
      "A ação de manutenção de posse é adequada para os casos de turbação, em que o exercício da posse é perturbado sem a perda total do bem."
    ]
  },
  {
    q: "O possuidor que sofre uma agressão injusta à sua posse pode defender-se por força própria por meio do desforço imediato (Art. 1.210, § 1º, do CC). Para que essa autotutela seja legítima, exige-se que:",
    options: [
      "A força empregada resulte na perda definitiva da propriedade pelo invasor sem necessidade de indenização.",
      "O possuidor obtenha autorização judicial prévia antes de empregar qualquer medida defensiva de força.",
      "A reação ocorra a qualquer tempo, mesmo meses após a invasão, desde que seja comprovada a titularidade do imóvel.",
      "O possuidor aja incontinenti após a agressão, empregando força estritamente proporcional para restaurar a posse."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. A autotutela possessória limita-se a defender o fato da posse, não podendo extrapolar a proporcionalidade nem decidir a titularidade da propriedade.",
      "O desforço imediato é espécie de autotutela extrajudicial autorizada por lei justamente para afastar a necessidade de provimento judicial imediato.",
      "A reação tardia descaracteriza o desforço imediato, exigindo que a recuperação do imóvel seja buscada pelas vias judiciais.",
      "Resposta correta. O desforço imediato exige reação imediata à agressão e uso moderado dos meios de defesa para manter ou restituir a situação possessória."
    ]
  },
  {
    q: "No que tange aos efeitos da posse sobre benfeitorias, qual é o direito assegurado ao possuidor de boa-fé em relação às benfeitorias necessárias e úteis?",
    options: [
      "Direito de retenção restrito às benfeitorias voluptuárias, desde que não causem deterioração ao imóvel.",
      "Perda de todas as benfeitorias efetuadas em favor do proprietário, independentemente de indenização.",
      "Direito apenas ao ressarcimento das necessárias, sem qualquer possibilidade de retenção do bem.",
      "Direito à indenização por ambas e ao exercício do direito de retenção sobre a coisa enquanto não for pago."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. As benfeitorias voluptuárias podem ser levantadas se não forem pagas, mas não geram direito de retenção do bem pelo possuidor.",
      "A perda sem indenização contraria as regras protetivas do Código Civil destinadas ao possuidor que atuou munido de boa-fé.",
      "O ressarcimento exclusivo das benfeitorias necessárias e sem direito de retenção é a regra aplicável ao possuidor de má-fé (Art. 1.220).",
      "Resposta correta. Conforme o art. 1.219 do Código Civil, o possuidor de boa-fé tem direito à indenização das benfeitorias necessárias e úteis, podendo exercer o direito de retenção."
    ]
  },
  {
    q: "No ordenamento jurídico brasileiro, como se opera a efetiva transferência da propriedade de um bem imóvel entre vivos (Art. 1.245 do CC)?",
    options: [
      "Apenas com a assinatura e o pagamento integral do preço fixado no contrato particular de compra e venda.",
      "Através da simples entrega das chaves ao comprador (tradição).",
      "Apenas com a lavratura da escritura pública no Cartório de Notas.",
      "Mediante o registro do título translativo no Cartório de Registro de Imóveis competente."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. O contrato gera apenas obrigações entre as partes, não transferindo por si só o direito real de propriedade sobre o bem imóvel.",
      "A tradição é a forma de transferência da propriedade de bens móveis, sendo ineficaz para transferir a propriedade de bens imóveis.",
      "A escritura pública formaliza o negócio jurídico, mas a transferência do domínio exige ato subsequente no registro imobiliário.",
      "Resposta correta. Nos termos do art. 1.245 do Código Civil, a propriedade imobiliária entre vivos somente se transfere com o registro do título no Registro de Imóveis."

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================
function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";

    if (alreadyAnswered) {
      cls += " answered";
      if (i === q.correct) cls += " correct";
      else if (i === answers[currentIndex]) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      const isCorrectOpt = i === q.correct;
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
          ${exp}
        </div>`;
    }

    html += `
      <div class="${cls}" id="opt-${i}" onclick="selectOption(${i})">
        <div class="option-header">
          <div class="option-letter">${letters[i]}</div>
          <div class="option-text">${opt}</div>
        </div>
        ${fbHtml}
      </div>`;
  });

  card.innerHTML = html;

  const pct = (currentIndex / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} / ${questions.length}`;

  const btn = document.getElementById("btnNext");
  btn.disabled = !alreadyAnswered;
  btn.textContent = currentIndex === questions.length - 1 ? "Ver resultado →" : "Próxima →";
  answeredCurrent = alreadyAnswered;
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return; // já respondeu

  answers[currentIndex] = idx;
  answeredCurrent = true;

  const q = questions[currentIndex];
  const letters = ["A", "B", "C", "D", "E", "F"];

  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    el.classList.add("answered");
    el.onclick = null;

    if (i === q.correct) el.classList.add("correct");
    else if (i === idx) el.classList.add("wrong");

    const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
    const isCorrectOpt = i === q.correct;

    const fb = document.createElement("div");
    fb.className = `option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}`;
    fb.innerHTML = `
      <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
      ${exp}`;
    el.appendChild(fb);
  });

  document.getElementById("btnNext").disabled = false;
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (a === questions[i].correct) correct++; });
  const total = questions.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = correct;
  document.querySelector("#scoreCircle .label").textContent = `de ${total}`;

  const circle = document.getElementById("scoreCircle");
  if (pct >= 70) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (pct >= 50) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${pct}% de acertos`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    const div = document.createElement("div");
    div.className = `result-item ${isCorrect ? "ok" : "err"}`;
    div.innerHTML = `
      <h4>
        <span class="badge ${isCorrect ? "badge-ok" : "badge-err"}">${isCorrect ? "✓ Acertou" : "✗ Errou"}</span>
        ${i + 1} / ${total}
      </h4>
      <p style="font-weight:600; margin-bottom:5px;">${q.q}</p>
      <p><b>Sua resposta:</b> ${userAns !== null ? letters[userAns] + ") " + q.options[userAns] : "—"}</p>
      ${!isCorrect ? `<p><b>Correta:</b> ${letters[q.correct]}) ${q.options[q.correct]}</p>` : ""}
      <p style="margin-top:6px;"><b>Explicação:</b> ${(q.explanations && q.explanations[q.correct]) || ""}</p>
    `;
    review.appendChild(div);
  });

  document.getElementById("progressFill").style.width = "100%";
}

function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}

loadQuestions();
