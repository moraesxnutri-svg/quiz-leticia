<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quiz para Letícia</title>

<!-- Ícone e tela inicial do celular -->
<meta name="theme-color" content="#1a365d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quiz Letícia">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="152x152" href="apple-touch-icon.png?v=2">
<link rel="apple-touch-icon" sizes="167x167" href="apple-touch-icon.png?v=2">

<style>
  :root {
    --azul: #1a365d;
    --azul2: #2b6cb0;
    --azul-claro: #ebf8ff;
    --verde: #276749;
    --verde-claro: #c6f6d5;
    --vermelho: #c53030;
    --vermelho-claro: #fed7d7;
    --cinza: #4a5568;
    --fundo: #f7fafc;
    --branco: #ffffff;
    --sombra: 0 4px 14px rgba(0,0,0,0.09);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  /* Impede seleção / cópia de texto (anti-cola no GPT) */
  body, .card, .question-text, .option, .option-text, .explanation, .result-item {
    -webkit-user-select: none !important;
    -moz-user-select: none !important;
    -ms-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(160deg, #edf2f7 0%, #e2e8f0 100%);
    min-height: 100vh;
    color: #1a202c;
    line-height: 1.5;
  }

  .container {
    max-width: 680px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }

  header {
    background: var(--azul);
    color: white;
    padding: 24px 18px;
    border-radius: 16px;
    margin-bottom: 20px;
    text-align: center;
    box-shadow: var(--sombra);
  }
  header h1 { font-size: 1.55rem; margin-bottom: 4px; letter-spacing: -0.3px; }
  header p { opacity: 0.8; font-size: 0.9rem; }

  .card {
    background: var(--branco);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: var(--sombra);
  }

  .progress-bar {
    height: 7px;
    background: #e2e8f0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--azul2), #4299e1);
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  .progress-text {
    font-size: 0.82rem;
    color: var(--cinza);
    text-align: right;
    margin-bottom: 14px;
  }

  .question-num {
    display: inline-block;
    background: var(--azul-claro);
    color: var(--azul);
    font-weight: 700;
    font-size: 0.85rem;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .question-text {
    font-size: 1.08rem;
    font-weight: 600;
    margin-bottom: 18px;
    color: #1a202c;
  }

  .option {
    display: flex;
    flex-direction: column;
    padding: 13px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.18s;
    background: #fff;
  }
  .option:hover:not(.disabled):not(.answered) {
    border-color: var(--azul2);
    background: var(--azul-claro);
  }
  .option.selected { border-color: var(--azul2); background: var(--azul-claro); }
  .option.correct { border-color: var(--verde); background: var(--verde-claro); }
  .option.wrong { border-color: var(--vermelho); background: var(--vermelho-claro); }
  .option.disabled, .option.answered { cursor: default; }

  .option-header {
    display: flex;
    align-items: flex-start;
    gap: 11px;
  }
  .option-letter {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #edf2f7;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--cinza);
  }
  .option.selected .option-letter { background: var(--azul2); color: white; }
  .option.correct .option-letter { background: var(--verde); color: white; }
  .option.wrong .option-letter { background: var(--vermelho); color: white; }

  .option-text { flex: 1; padding-top: 2px; font-size: 0.93rem; }

  .option-feedback {
    margin-top: 8px;
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 0.84rem;
    display: none;
    line-height: 1.4;
  }
  .option-feedback.show { display: block; }
  .option-feedback.fb-correct {
    background: rgba(39,103,73,0.12);
    color: #1a4731;
    border-left: 3px solid var(--verde);
  }
  .option-feedback.fb-wrong {
    background: rgba(197,48,48,0.1);
    color: #742a2a;
    border-left: 3px solid var(--vermelho);
  }
  .fb-label {
    font-weight: 700;
    display: block;
    margin-bottom: 3px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary { background: var(--azul); color: white; }
  .btn-primary:hover { background: #2c5282; }
  .btn-primary:disabled { background: #a0aec0; cursor: not-allowed; }
  .btn-secondary { background: #edf2f7; color: var(--azul); }
  .btn-secondary:hover { background: #e2e8f0; }
  .btn-danger { background: var(--vermelho); color: white; }
  .btn-success { background: var(--verde); color: white; }

  .btn-row {
    display: flex;
    gap: 10px;
    margin-top: 18px;
    flex-wrap: wrap;
  }

  .score-circle {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    font-weight: 700;
    border: 7px solid;
  }
  .score-circle .num { font-size: 2.2rem; line-height: 1; }
  .score-circle .label { font-size: 0.82rem; opacity: 0.8; }

  .result-item {
    padding: 13px;
    border-radius: 10px;
    margin-bottom: 10px;
    border-left: 4px solid;
  }
  .result-item.ok { background: var(--verde-claro); border-color: var(--verde); }
  .result-item.err { background: var(--vermelho-claro); border-color: var(--vermelho); }
  .result-item h4 { font-size: 0.92rem; margin-bottom: 5px; }
  .result-item p { font-size: 0.84rem; color: #2d3748; }

  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.73rem;
    font-weight: 600;
  }
  .badge-ok { background: var(--verde-claro); color: var(--verde); }
  .badge-err { background: var(--vermelho-claro); color: var(--vermelho); }

  .admin-panel { display: none; }
  .admin-panel.active { display: block; }

  textarea, input[type="text"], input[type="password"] {
    width: 100%;
    padding: 10px 12px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.92rem;
    margin-bottom: 10px;
    font-family: inherit;
  }
  textarea { min-height: 90px; resize: vertical; }

  .admin-q {
    background: #f7fafc;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 13px;
    margin-bottom: 12px;
  }
  .admin-q h4 { margin-bottom: 7px; color: var(--azul); font-size: 0.95rem; }

  .hidden { display: none !important; }
  .start-screen, .result-screen, .quiz-screen { display: none; }
  .start-screen.active, .result-screen.active, .quiz-screen.active { display: block; }

  .bulk-box {
    background: #f0fff4;
    border: 1px dashed var(--verde);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .bulk-box h4 { color: var(--verde); margin-bottom: 8px; font-size: 0.95rem; }
  .bulk-box p { font-size: 0.82rem; color: var(--cinza); margin-bottom: 8px; }
  .bulk-box pre {
    background: #1a202c;
    color: #e2e8f0;
    padding: 10px;
    border-radius: 8px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
    margin-bottom: 10px;
    user-select: text !important;
    -webkit-user-select: text !important;
  }

  footer {
    text-align: center;
    margin-top: 28px;
    font-size: 0.78rem;
    color: var(--cinza);
  }

  @media (max-width: 500px) {
    header h1 { font-size: 1.3rem; }
    .question-text { font-size: 1rem; }
  }
</style>
</head>
<body oncontextmenu="return false;">
<div class="container">

  <header>
    <h1>📝 Quiz para Letícia</h1>
    <p>Teste seus conhecimentos</p>
  </header>

  <!-- TELA INICIAL -->
  <div id="startScreen" class="start-screen active">
    <div class="card" style="text-align:center;">
      <h2 style="margin-bottom:10px; color:var(--azul); font-size:1.2rem;">Pronta para começar?</h2>
      <p style="color:var(--cinza); margin-bottom:18px; font-size:0.92rem;">
        Responda as questões. Ao clicar em uma alternativa você já vê se acertou ou errou, com a explicação.
      </p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="startQuiz()">Começar</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div id="quizScreen" class="quiz-screen">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-text" id="progressText">1 / 10</div>

    <div class="card" id="questionCard"></div>

    <div class="btn-row">
      <button class="btn btn-primary" id="btnNext" onclick="nextQuestion()" disabled>Próxima →</button>
    </div>
  </div>

  <!-- RESULTADO -->
  <div id="resultScreen" class="result-screen">
    <div class="card" style="text-align:center;">
      <div class="score-circle" id="scoreCircle">
        <span class="num" id="scoreNum">0</span>
        <span class="label">de 10</span>
      </div>
      <h2 id="scoreMessage" style="margin-bottom:6px; font-size:1.2rem;"></h2>
      <p id="scorePercent" style="color:var(--cinza); margin-bottom:18px;"></p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-primary" onclick="restartQuiz()">Fazer novamente</button>
        <button class="btn btn-secondary" onclick="backToStart()">Início</button>
      </div>
    </div>
    <h3 style="margin:18px 0 10px; color:var(--azul); font-size:1.05rem;">Revisão</h3>
    <div id="reviewList"></div>
  </div>

  <footer>Quiz para Letícia</footer>
</div>

<script>
// ===================== QUESTÕES PADRÃO =====================
const DEFAULT_QUESTIONS = [
  {
    q: "De acordo com o art. 1.224 do Código Civil, na hipótese de esbulho ocorrido sem a presença do possuidor, quando se considera efetivamente perdida a posse por este?",
    options: [
      "Automaticamente após decorridos 5 anos de ocupação ininterrupta pelos invasores.",
      "No exato momento em que o terceiro invade o imóvel e troca as fechaduras das portas.",
      "Apenas no momento em que transcorrer o prazo de 1 ano e 1 dia contado da data da invasão.",
      "Quando, tendo notícia da invasão, o possuidor se abstém de retornar à coisa ou, tentando recuperá-la, é violentamente repelido."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. Esse é um prazo atrelado a certas modalidades de usucapião ou posse coletiva, e não à regra geral de perda da posse insculpida no art. 1.224.",
      "O dispositivo condiciona a perda da posse ao conhecimento do fato pelo possuidor e ao seu comportamento posterior.",
      "O prazo de ano e dia diz respeito à classificação entre posse nova e posse velha para fins de rito processual, não à caracterização de perda pelo art. 1.224.",
      "Resposta correta. O artigo 1.224 prescreve expressamente que a perda da posse para quem não presenciou o esbulho se configura se, ciente do ato, o possuidor se abstém de voltar ou é repelido com violência ao tentar a recuperação."
    ]
  },
  {
    q: "Caso o possuidor tome conhecimento de um esbulho não presenciado e imediatamente se dirija ao local, conseguindo expelir o invasor com uso proporcional de sua própria força, qual instituto fundamenta a legalidade de sua conduta?",
    options: [
      "Abandono voluntário da coisa ou derelictio.",
      "Desforço imediato, previsto no art. 1.210, § 1º do Código Civil.",
      "Conversão automática da posse justa em detenção precária.",
      "Consolidação da perda da posse nos termos do art. 1.224 do Código Civil."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. O abandono pressupõe a intenção deliberada de deixar de exercer poderes sobre o bem, e não a reação física de recuperação.",
      "Resposta correta. A reação imediata e com força proporcional para restituir a posse configura o desforço imediato, expressamente franqueado ao possuidor esbulhado.",
      "A legítima defesa possessória não degrada a situação jurídica do possuidor em mero detentor.",
      "Como o possuidor reagiu prontamente e obteve êxito na restauração do seu poder de fato, não houve a consolidação da perda da posse."
    ]
  },
  {
    q: "Em relação ao possuidor de boa-fé, quais são os seus direitos quanto às benfeitorias úteis realizadas no imóvel, caso não venham a ser pagas pelo proprietário reivindicante?",
    options: [
      "Tem direito à indenização pelo valor das benfeitorias e ao exercício do direito de retenção do imóvel até o efetivo pagamento.",
      "Pode apenas levantar as benfeitorias úteis, desde que sem detrimento da coisa, sem qualquer direito a ressarcimento financeiro.",
      "Perde o direito às benfeitorias úteis, recebendo ressarcimento exclusivo pelas benfeitorias necessárias.",
      "Tem direito à indenização pelo valor atualizado, porém sem direito de retenção sobre o imóvel."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! Segundo o art. 1.219 do Código Civil, o possuidor de boa-fé tem direito à indenização e ao direito de retenção tanto pelas benfeitorias necessárias quanto pelas úteis.",
      "O direito de levantamento sem detrimento da coisa refere-se às benfeitorias voluptuárias, e não às úteis.",
      "A limitação de indenização apenas às benfeitorias necessárias aplica-se ao possuidor de má-fé, nos termos do art. 1.220.",
      "O possuidor de boa-fé conta com a garantia do direito de retenção também para as benfeitorias úteis."
    ]
  },
  {
    q: "Qual é o tratamento jurídico conferido pelo art. 1.220 do Código Civil ao possuidor de má-fé no tocante às benfeitorias voluptuárias por ele inseridas na coisa?",
    options: [
      "Pode exercer o direito de retenção até que o valor atribuído às voluptuárias seja integralmente ressarcido.",
      "Pode retirar (levantar) as benfeitorias voluptuárias, desde que isso não cause prejuízo ou deterioração ao bem.",
      "Não tem direito ao ressarcimento das benfeitorias voluptuárias e nem pode levantá-las do imóvel.",
      "Tem direito de ser indenizado pelo valor de custo de tais benfeitorias, mas sem direito de retenção."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. O possuidor de má-fé não possui direito de retenção sob nenhuma hipótese no ordenamento civil.",
      "A faculdade de levantar benfeitorias voluptuárias quando não pagas e sem detrimento da coisa é restrita ao possuidor de boa-fé.",
      "Resposta correta. Conforme expressa disposição do art. 1.220, ao possuidor de má-fé são ressarcidas somente as benfeitorias necessárias, vedando-se o levantamento das voluptuárias e o direito de retenção.",
      "O possuidor de má-fé não tem direito de indenização por benfeitorias voluptuárias, mas tão somente pelas necessárias."
    ]
  },
  {
    q: "Considere que um possuidor de má-fé realize obras de reparo emergencial em um imóvel para impedir a ruína do telhado. Como o Código Civil disciplina essa benfeitoria?",
    options: [
      "Por estar de má-fé, o possuidor perde qualquer direito de ressarcimento, mesmo por obras de conservação essencial.",
      "Trata-se de benfeitoria útil, o que garante ao possuidor de má-fé a indenização e o direito de levantamento das estruturas.",
      "O possuidor terá direito à indenização integral e poderá reter o bem até o pagamento, assim como ocorreria se estivesse de boa-fé.",
      "Trata-se de benfeitoria necessária, devendo ser indenizada, mas sem conferir ao possuidor o direito de retenção do imóvel."
    ],
    correct: 3,
    explanations: [
      "Não é bem isso. A lei assegura a indenização das benfeitorias necessárias ao possuidor de má-fé para que o proprietário não se beneficie injustamente da conservação de seu patrimônio.",
      "Reparos urgentes para impedir a ruína do bem são benfeitorias necessárias, e não úteis; além disso, a má-fé impede a indenização por benfeitorias úteis.",
      "O direito de retenção é uma prerrogativa de garantia exclusiva do possuidor de boa-fé.",
      "Resposta correta. Os reparos emergenciais são benfeitorias necessárias; o art. 1.220 garante a indenização destas ao possuidor de má-fé para evitar o enriquecimento sem causa do reivindicante, porém nega-lhe expressamente o direito de retenção."
    ]
  },
  {
    q: "Sobre a divergência doutrinária a respeito do rol dos direitos reais insculpido no art. 1.225 do Código Civil, assinale a assertiva correta:",
    options: [
      "A corrente majoritária defende que o rol é exemplificativo, permitindo que as partes criem novos direitos reais por meio de contratos privados.",
      "A corrente majoritária sustenta que o rol é taxativo (numerus clausus), enquanto a posição minoritária defende a tipicidade legal com possibilidade de criação de novos direitos reais por leis extravagantes.",
      "O Código Civil adotou expressamente o princípio do numerus apertus, deixando a definição dos direitos reais a critério exclusivo da jurisprudência.",
      "Existe consenso absoluto de que leis extravagantes não possuem competência para instituir direitos reais fora do Código Civil."
    ],
    correct: 1,
    explanations: [
      "Não é bem isso. A autonomia privada contratual não pode criar direitos reais; a corrente minoritária defende a exemplificatividade no sentido de ampliação por legislação esparsa.",
      "Resposta correta. A doutrina dominante enxerga no art. 1.225 um rol taxativo, ao passo que autores como Flávio Tartuce apontam uma tipicidade legal atenuada pela criação de institutos como a alienação fiduciária em legislação extravagante.",
      "O sistema pátrio é regido precipuamente pelo numerus clausus e pela previsão estrita da lei.",
      "Há posições doutrinárias consolidadas que reconhecem direitos reais instituídos por legislação esparsa, como a alienação fiduciária (Lei 9.514/97)."
    ]
  },
  {
    q: "O artigo 1.228, § 2º do Código Civil veda a prática de atos emulativos pelo proprietário. Qual alternativa descreve com precisão a essência de um ato emulativo?",
    options: [
      "A transmissão da propriedade imóvel realizada mediante promessa de compra e venda sem formalização de escritura.",
      "A cobrança de aluguel por parte do possuidor indireto em valores acima da média de mercado praticada no município.",
      "O ato praticado pelo proprietário sem qualquer comodidade ou utilidade para si, movido pela intenção exclusiva de causar dano ou incômodo a outrem.",
      "O exercício do direito de propriedade com vistas ao cumprimento direto de diretrizes ambientais e normas urbanísticas."
    ],
    correct: 2,
    explanations: [
      "Não é bem isso. Essa é uma limitação formal no negócio de transmissão imobiliária, e não um ato emulativo.",
      "A precificação do aluguel decorre da livre negociação contratual e da autonomia privada, não caracterizando ato emulativo.",
      "Resposta correta. A teoria dos atos emulativos veda o uso do direito de propriedade desprovido de utilidade legítima e guiado pela intenção de prejudicar terceiros, como erguer um muro desproporcional apenas para bloquear a iluminação do vizinho.",
      "Isso reflete o cumprimento da função social e ambiental da propriedade, e não a prática de ato ilícito emulativo."
    ]
  },
  {
    q: "Em relação ao instituto denominado pela doutrina como 'desapropriação judicial privada' ou 'posse-trabalho', previsto no art. 1.228, §§ 4º e 5º do CC, é correto afirmar que:",
    options: [
      "Exige posse ininterrupta e de boa-fé por mais de cinco anos de extensa área por considerável número de pessoas que nele realizaram obras ou serviços de relevante interesse social e econômico, mediante justa indenização ao proprietário.",
      "Pode ser invocada por um único possuidor individual, desde que a área ocupada seja inferior a 250 m² em zona urbana.",
      "Transfere automaticamente a propriedade ao Ente Público, que se encarrega de indenizar o proprietário e loteá-la.",
      "Trata-se de uma modalidade de usucapião extraordinária que prescinde do pagamento de qualquer indenização ao proprietário reivindicante."
    ],
    correct: 0,
    explanations: [
      "Isso mesmo! Esses são os requisitos cumulativos do art. 1.228, §§ 4º e 5º para que ocorra a perda da propriedade em favor dos possuidores mediante sentença que vale como título registral após o pagamento da indenização.",
      "O § 4º exige expressamente extensa área e ocupação coletiva por 'considerável número de pessoas'.",
      "A perda da propriedade ocorre em favor dos próprios possuidores e a sentença serve como título para o registro no nome deles após o pagamento do preço.",

// ===================== ESTADO =====================
let questions = [];
let currentIndex = 0;
let answers = [];
let answeredCurrent = false;
const ADMIN_PASSWORD = "direitos2026";

// ===================== LOAD / SAVE =====================
function loadQuestions() {
  // Sempre usa as questões do código (atualiza em todos os aparelhos)
  localStorage.removeItem("quiz_leticia_questions");
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
}

function saveToStorage() {
  localStorage.setItem("quiz_leticia_questions", JSON.stringify(questions));
}

// ===================== TELAS =====================
function showScreen(id) {
  document.querySelectorAll(".start-screen, .quiz-screen, .result-screen, .admin-panel")
    .forEach(el => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function backToStart() { showScreen("startScreen"); }

// ===================== QUIZ =====================
function startQuiz() {
  loadQuestions();
  if (!questions.length) { alert("Não há questões!"); return; }
  currentIndex = 0;
  answers = new Array(questions.length).fill(null);
  answeredCurrent = false;
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentIndex];
  const card = document.getElementById("questionCard");
  const letters = ["A", "B", "C", "D", "E", "F"];
  const alreadyAnswered = answers[currentIndex] !== null;

  let html = `
    <div class="question-num">${currentIndex + 1} / ${questions.length}</div>
    <div class="question-text">${q.q}</div>
  `;

  q.options.forEach((opt, i) => {
    let cls = "option";
    let fbHtml = "";

    if (alreadyAnswered) {
      cls += " answered";
      if (i === q.correct) cls += " correct";
      else if (i === answers[currentIndex]) cls += " wrong";

      const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
      const isCorrectOpt = i === q.correct;
      fbHtml = `
        <div class="option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}">
          <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
          ${exp}
        </div>`;
    }

    html += `
      <div class="${cls}" id="opt-${i}" onclick="selectOption(${i})">
        <div class="option-header">
          <div class="option-letter">${letters[i]}</div>
          <div class="option-text">${opt}</div>
        </div>
        ${fbHtml}
      </div>`;
  });

  card.innerHTML = html;

  const pct = (currentIndex / questions.length) * 100;
  document.getElementById("progressFill").style.width = pct + "%";
  document.getElementById("progressText").textContent = `${currentIndex + 1} / ${questions.length}`;

  const btn = document.getElementById("btnNext");
  btn.disabled = !alreadyAnswered;
  btn.textContent = currentIndex === questions.length - 1 ? "Ver resultado →" : "Próxima →";
  answeredCurrent = alreadyAnswered;
}

function selectOption(idx) {
  if (answers[currentIndex] !== null) return; // já respondeu

  answers[currentIndex] = idx;
  answeredCurrent = true;

  const q = questions[currentIndex];
  const letters = ["A", "B", "C", "D", "E", "F"];

  q.options.forEach((_, i) => {
    const el = document.getElementById(`opt-${i}`);
    el.classList.add("answered");
    el.onclick = null;

    if (i === q.correct) el.classList.add("correct");
    else if (i === idx) el.classList.add("wrong");

    const exp = (q.explanations && q.explanations[i]) ? q.explanations[i] : "";
    const isCorrectOpt = i === q.correct;

    const fb = document.createElement("div");
    fb.className = `option-feedback show ${isCorrectOpt ? "fb-correct" : "fb-wrong"}`;
    fb.innerHTML = `
      <span class="fb-label">${isCorrectOpt ? "✓ Resposta correta" : "✗ Não é bem isso"}</span>
      ${exp}`;
    el.appendChild(fb);
  });

  document.getElementById("btnNext").disabled = false;
}

function nextQuestion() {
  if (answers[currentIndex] === null) return;
  if (currentIndex < questions.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz() {
  showScreen("resultScreen");
  let correct = 0;
  answers.forEach((a, i) => { if (a === questions[i].correct) correct++; });
  const total = questions.length;
  const pct = Math.round((correct / total) * 100);

  document.getElementById("scoreNum").textContent = correct;
  document.querySelector("#scoreCircle .label").textContent = `de ${total}`;

  const circle = document.getElementById("scoreCircle");
  if (pct >= 70) {
    circle.style.borderColor = "var(--verde)";
    circle.style.color = "var(--verde)";
    document.getElementById("scoreMessage").textContent = "Mandou bem! 🎉";
  } else if (pct >= 50) {
    circle.style.borderColor = "#d69e2e";
    circle.style.color = "#d69e2e";
    document.getElementById("scoreMessage").textContent = "Quase lá! 💪";
  } else {
    circle.style.borderColor = "var(--vermelho)";
    circle.style.color = "var(--vermelho)";
    document.getElementById("scoreMessage").textContent = "Precisa revisar 📖";
  }
  document.getElementById("scorePercent").textContent = `${pct}% de acertos`;

  const review = document.getElementById("reviewList");
  review.innerHTML = "";
  const letters = ["A", "B", "C", "D", "E"];

  questions.forEach((q, i) => {
    const userAns = answers[i];
    const isCorrect = userAns === q.correct;
    const div = document.createElement("div");
    div.className = `result-item ${isCorrect ? "ok" : "err"}`;
    div.innerHTML = `
      <h4>
        <span class="badge ${isCorrect ? "badge-ok" : "badge-err"}">${isCorrect ? "✓ Acertou" : "✗ Errou"}</span>
        ${i + 1} / ${total}
      </h4>
      <p style="font-weight:600; margin-bottom:5px;">${q.q}</p>
      <p><b>Sua resposta:</b> ${userAns !== null ? letters[userAns] + ") " + q.options[userAns] : "—"}</p>
      ${!isCorrect ? `<p><b>Correta:</b> ${letters[q.correct]}) ${q.options[q.correct]}</p>` : ""}
      <p style="margin-top:6px;"><b>Explicação:</b> ${(q.explanations && q.explanations[q.correct]) || ""}</p>
    `;
    review.appendChild(div);
  });

  document.getElementById("progressFill").style.width = "100%";
}

function restartQuiz() { startQuiz(); }

// ===================== ADMIN =====================
function showAdminLogin() {
  showScreen("adminPanel");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("adminContent").classList.add("hidden");
  document.getElementById("adminPass").value = "";
}

function checkAdminPass() {
  if (document.getElementById("adminPass").value === ADMIN_PASSWORD) {
    document.getElementById("adminLogin").classList.add("hidden");
    document.getElementById("adminContent").classList.remove("hidden");
    loadQuestions();
    renderAdminList();
  } else {
    alert("Senha incorreta!");
  }
}

function closeAdmin() { showScreen("startScreen"); }

function renderAdminList() {
  const container = document.getElementById("adminQuestionsList");
  container.innerHTML = "";
  questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "admin-q";
    const exps = (q.explanations || []).join("\n---\n");
    div.innerHTML = `
      <h4>Questão ${idx + 1}</h4>
      <label style="font-size:0.82rem; font-weight:600;">Enunciado:</label>
      <textarea id="aq-${idx}">${q.q}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Alternativas (uma por linha):</label>
      <textarea id="ao-${idx}">${q.options.join("\n")}</textarea>
      <label style="font-size:0.82rem; font-weight:600;">Índice da correta (0=A, 1=B...):</label>
      <input type="text" id="ac-${idx}" value="${q.correct}" style="width:70px;">
      <label style="font-size:0.82rem; font-weight:600;">Explicações (uma por alternativa, separadas por ---):</label>
      <textarea id="ae-${idx}" style="min-height:110px;">${exps}</textarea>
      <button class="btn btn-danger" style="margin-top:6px; padding:7px 12px; font-size:0.82rem;" onclick="deleteQuestion(${idx})">🗑️ Remover</button>
    `;
    container.appendChild(div);
  });
}

function collectAdminData() {
  const arr = [];
  for (let i = 0; i < questions.length; i++) {
    const qEl = document.getElementById(`aq-${i}`);
    if (!qEl) continue;
    const opts = document.getElementById(`ao-${i}`).value.split("\n").map(s => s.trim()).filter(Boolean);
    const correct = parseInt(document.getElementById(`ac-${i}`).value, 10) || 0;
    const expsRaw = document.getElementById(`ae-${i}`).value.split("---").map(s => s.trim());
    arr.push({
      q: qEl.value.trim(),
      options: opts,
      correct,
      explanations: expsRaw
    });
  }
  return arr;
}

function saveQuestions() {
  questions = collectAdminData();
  saveToStorage();
  alert("Salvo com sucesso!");
  renderAdminList();
}

function addNewQuestion() {
  questions = collectAdminData();
  questions.push({
    q: "Nova questão",
    options: ["Alternativa A", "Alternativa B", "Alternativa C", "Alternativa D"],
    correct: 0,
    explanations: ["Explicação A", "Explicação B", "Explicação C", "Explicação D"]
  });
  renderAdminList();
}

function deleteQuestion(idx) {
  if (!confirm("Remover?")) return;
  questions = collectAdminData();
  questions.splice(idx, 1);
  renderAdminList();
}

function resetToDefault() {
  if (!confirm("Restaurar questões padrão?")) return;
  questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
  saveToStorage();
  renderAdminList();
}

function exportQuestions() {
  questions = collectAdminData();
  const blob = new Blob([JSON.stringify(questions, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "questoes-leticia.json";
  a.click();
}

// ===================== IMPORTAÇÃO EM LOTE =====================
function importBulk() {
  const text = document.getElementById("bulkInput").value.trim();
  if (!text) { alert("Cole as questões primeiro!"); return; }

  const blocks = text.split(/^---$/m).map(b => b.trim()).filter(Boolean);
  const parsed = [];

  for (const block of blocks) {
    const lines = block.split("\n").map(l => l.trim()).filter(Boolean);
    let pergunta = "";
    const opcoes = [];
    let correta = 0;
    const explicacoes = [];

    for (const line of lines) {
      if (/^PERGUNTA:/i.test(line)) {
        pergunta = line.replace(/^PERGUNTA:\s*/i, "").trim();
      } else if (/^[A-F]\)\s*/i.test(line)) {
        opcoes.push(line.replace(/^[A-F]\)\s*/i, "").trim());
      } else if (/^CORRETA:/i.test(line)) {
        const letra = line.replace(/^CORRETA:\s*/i, "").trim().toUpperCase();
        correta = letra.charCodeAt(0) - 65; // A=0, B=1...
      } else if (/^EXPLICACAO_[A-F]:/i.test(line)) {
        explicacoes.push(line.replace(/^EXPLICACAO_[A-F]:\s*/i, "").trim());
      }
    }

    if (pergunta && opcoes.length >= 2) {
      // garantir que tenha explicação para cada opção
      while (explicacoes.length < opcoes.length) explicacoes.push("");
      parsed.push({
        q: pergunta,
        options: opcoes,
        correct: correta,
        explanations: explicacoes
      });
    }
  }

  if (!parsed.length) {
    alert("Não consegui ler nenhuma questão. Confira o formato.");
    return;
  }

  questions = parsed;
  saveToStorage();
  document.getElementById("bulkInput").value = "";
  renderAdminList();
  alert(`Importadas ${parsed.length} questões com sucesso!`);
}

// ===================== INIT =====================
loadQuestions();
